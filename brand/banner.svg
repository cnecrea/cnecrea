    <circle cx="42" cy="42" r="38" fill="#18bcf2" opacity="0.08"/>
    <!-- House shape -->
    <path d="M42 12 L14 38 L22 38 L22 62 L34 62 L34 48 L50 48 L50 62 L62 62 L62 38 L70 38 Z" fill="#18bcf2" opacity="0.9"/>
    <!-- Window/dot -->
