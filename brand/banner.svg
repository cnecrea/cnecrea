<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 816" width="1456" height="816">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8edf8"/>
    </linearGradient>
    <linearGradient id="ha-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18bcf2"/>
      <stop offset="100%" stop-color="#049cdb"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18bcf2"/>
      <stop offset="100%" stop-color="#049cdb"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow2" x="-3%" y="-3%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="browser-clip">
      <rect x="750" y="80" width="660" height="650" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1456" height="816" fill="url(#bg)" rx="0"/>

  <!-- HA Logo (official home shape) -->
  <g transform="translate(60, 190)">
