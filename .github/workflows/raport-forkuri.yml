name: Raport zilnic fork-uri GitHub

on:
  schedule:
    # Zilnic la 08:17 UTC; raportul include inventarul complet și evidențiază fork-urile din ultimele 24h.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  raport-forkuri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Colectează fork-urile și generează raportul
        id: raport
        run: |
          python3 << 'PYTHONEOF'
          import html
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          owner = "cnecrea"
          repos = {
              "reteleelectrice": "Rețele Electrice",
              "opcom": "OPCOM",
              "fleet": "Manager de flotă",
              "vehicule": "Vehicule",
              "vreaulanova": "Nova Power & Gas",
          }
          acum = datetime.now(timezone.utc)
          prag_nou = acum - timedelta(hours=24)
          tz = ZoneInfo("Europe/Madrid")
          moment = acum.astimezone(tz).strftime("%d.%m.%Y %H:%M %Z")
          headers = {"Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "raport-forkuri-cnecrea"}

          def preia(repo):
              toate = []
              for pagina in range(1, 101):
                  query = urllib.parse.urlencode({"sort": "newest", "per_page": 100, "page": pagina})
                  url = f"https://api.github.com/repos/{owner}/{repo}/forks?{query}"
                  cerere = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(cerere, timeout=30) as raspuns:
                      lot = json.load(raspuns)
                  toate.extend(lot)
                  if len(lot) < 100:
                      break
              return toate

          raport = []
          for repo, nume in repos.items():
              item = {"repo": repo, "nume": nume, "url": f"https://github.com/{owner}/{repo}",
                      "forkuri": [], "eroare": None}
              try:
                  for fork in preia(repo):
                      item["forkuri"].append({
                          "nume": fork.get("full_name", "fork necunoscut"),
                          "url": fork.get("html_url", ""),
                          "owner": (fork.get("owner") or {}).get("login", "necunoscut"),
                          "created": datetime.fromisoformat(fork["created_at"].replace("Z", "+00:00")),
                      })
                  item["forkuri"].sort(key=lambda f: f["created"], reverse=True)
              except urllib.error.HTTPError as e:
                  item["eroare"] = "HTTP " + str(e.code)
              except Exception as e:
                  item["eroare"] = type(e).__name__
              raport.append(item)

          total = sum(len(r["forkuri"]) for r in raport)
          noi = sum(f["created"] >= prag_nou for r in raport for f in r["forkuri"])
          erori = sum(bool(r["eroare"]) for r in raport)
          subiect = f"Raport fork-uri GitHub · {noi} noi în ultimele 24h · {total} în total"
          if erori:
              subiect += f" · {erori} repo-uri cu eroare"
          linii = ["Raport fork-uri GitHub", moment,
                   f"{noi} fork-uri noi în ultimele 24h; {total} în total."]
          sectiuni = []
          tabel = []
          for r in raport:
              numar = len(r["forkuri"])
              tabel.append(f'| [{r["nume"]}]({r["url"]}) | {numar} |'
                           + (f' eroare: {r["eroare"]} |' if r["eroare"] else " |"))
              if r["eroare"]:
                  linii += ["", f'{r["nume"]}: eroare la citire ({r["eroare"]})']
                  sectiuni.append(f'<h3>{html.escape(r["nume"])}</h3><p>Eroare: {html.escape(r["eroare"])}</p>')
                  continue
              linii += ["", f'{r["nume"]} — {r["url"]} ({numar} fork-uri)']
              elemente = []
              for f in r["forkuri"]:
                  data = f["created"].astimezone(tz)
                  nou = f["created"] >= prag_nou
                  linii.append(f'  {f["nume"]} (@{f["owner"]}) — {data:%d.%m.%Y %H:%M} — {f["url"]}'
                               + (" [NOU]" if nou else ""))
                  badge = ' <strong style="color:#c2410c">NOU · ultimele 24h</strong>' if nou else ""
                  elemente.append(f'<li><a href="{html.escape(f["url"], quote=True)}">'
                                  f'{html.escape(f["nume"])}</a> (@{html.escape(f["owner"])}) '
                                  f'· {data:%d.%m.%Y %H:%M}{badge}</li>')
              if not elemente:
                  linii.append("  Niciun fork găsit.")
                  elemente.append("<li>Niciun fork găsit.</li>")
              sectiuni.append(f'<h3><a href="{html.escape(r["url"], quote=True)}">'
                              f'{html.escape(r["nume"])}</a> · {numar}</h3><ul>'
                              + "".join(elemente) + "</ul>")

          with open("forkuri.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(linii) + "\n")
          pagina = ('<!doctype html><html><body style="font-family:Arial,sans-serif;color:#16202c">'
                    f'<h2>Raport fork-uri GitHub</h2><p>{html.escape(moment)} · {noi} noi în ultimele 24h · {total} în total</p>'
                    '<table cellpadding="6" cellspacing="0" border="1"><tr><th>Repository</th><th>Fork-uri</th><th>Stare</th></tr>'
                    + "".join(tabel) + "</table>" + "".join(sectiuni) + "</body></html>")
          with open("forkuri.html", "w", encoding="utf-8") as f:
              f.write(pagina)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("subject=" + subiect + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"### {subiect}\n\n{moment}\n\n| Repository | Fork-uri | Stare |\n|---|---:|---|\n")
              f.write("\n".join(tabel) + "\n\n")
              for r in raport:
                  f.write(f'#### [{r["nume"]}]({r["url"]})\n\n')
                  if r["eroare"]:
                      f.write(f'Eroare: {r["eroare"]}\n\n')
                  elif r["forkuri"]:
                      for fork in r["forkuri"]:
                          data = fork["created"].astimezone(tz)
                          nou = " · **NOU**" if fork["created"] >= prag_nou else ""
                          f.write(f'- [{fork["nume"]}]({fork["url"]}) (@{fork["owner"]}) · {data:%d.%m.%Y %H:%M}{nou}\n')
                      f.write("\n")
                  else:
                      f.write("Niciun fork găsit.\n\n")
          print(subiect)
          PYTHONEOF

      - name: Trimite email folosind configurarea existentă
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DKIM_KEY: ${{ secrets.DKIM_GITHUB_KEY }}
          SUBIECT: ${{ steps.raport.outputs.subject }}
        run: |
          if [ -n "$DKIM_KEY" ]; then
            { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-dkim; } >/dev/null \
              || echo "::warning::Nu am putut instala python3-dkim"
          fi
          /usr/bin/python3 << 'PYTHONEOF'
          import os
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.utils import formatdate, getaddresses, make_msgid

          DOMENIU = "hubinteligent.org"
          SELECTOR = "github2026"
          EXPEDITOR = "github@" + DOMENIU
          ANTETE = [b"from", b"to", b"subject", b"date", b"message-id", b"mime-version", b"content-type"]
          destinatari = [adresa for _, adresa in getaddresses([os.environ["EMAIL_TO"]]) if adresa]
          mesaj = MIMEMultipart("alternative")
          mesaj["From"] = "GitHub Workflows <" + EXPEDITOR + ">"
          mesaj["To"] = ", ".join(destinatari)
          mesaj["Subject"] = os.environ["SUBIECT"]
          mesaj["Date"] = formatdate(localtime=True)
          mesaj["Message-ID"] = make_msgid(domain=DOMENIU)
          mesaj.attach(MIMEText(open("forkuri.txt", encoding="utf-8").read(), "plain", "utf-8"))
          mesaj.attach(MIMEText(open("forkuri.html", encoding="utf-8").read(), "html", "utf-8"))
          raw = mesaj.as_bytes(policy=mesaj.policy.clone(linesep="\r\n"))
          cheie = os.environ.get("DKIM_KEY", "").replace("\r\n", "\n").strip().encode()
          if cheie:
              try:
                  import dkim
                  semnatura = dkim.sign(raw, SELECTOR.encode(), DOMENIU.encode(), cheie + b"\n",
                                        canonicalize=(b"relaxed", b"relaxed"), include_headers=ANTETE)
                  data = semnatura + raw
              except Exception as e:
                  print("::warning::Semnarea DKIM a eșuat: " + type(e).__name__)
                  data = raw
          else:
              print("::warning::Lipsește secretul DKIM_GITHUB_KEY; emailul va fi nesemnat.")
              data = raw
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=60) as smtp:
              smtp.login(os.environ["EMAIL_USER"], os.environ["EMAIL_PASS"])
              smtp.sendmail(EXPEDITOR, destinatari, data)
          print("Email trimis către destinatarii configurați în EMAIL_TO.")
          PYTHONEOF
