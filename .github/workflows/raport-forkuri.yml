name: Raport zilnic fork-uri GitHub

on:
  schedule:
    # Zilnic la 08:17 UTC; raportul include inventarul complet și evidențiază fork-urile din ultimele 24h.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  raport-forkuri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Colectează fork-urile și generează raportul
        id: raport
        run: |
          python3 << 'PYTHONEOF'
          import html
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          owner = "cnecrea"
          repos = {
              "reteleelectrice": "Rețele Electrice",
              "opcom": "OPCOM",
              "fleet": "Manager de flotă",
              "vehicule": "Vehicule",
              "vreaulanova": "Nova Power & Gas",
          }
          tz = ZoneInfo("Europe/Madrid")
          acum = datetime.now(timezone.utc)
          prag_nou = acum - timedelta(hours=24)
          azi = acum.astimezone(tz).date()
          ieri = azi - timedelta(days=1)
          moment = acum.astimezone(tz).strftime("%d.%m.%Y, %H:%M")
          headers = {"Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "raport-forkuri-cnecrea"}

          def preia(repo):
              toate = []
              for pagina in range(1, 101):
                  query = urllib.parse.urlencode({"sort": "newest", "per_page": 100, "page": pagina})
                  url = f"https://api.github.com/repos/{owner}/{repo}/forks?{query}"
                  cerere = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(cerere, timeout=30) as raspuns:
                      lot = json.load(raspuns)
                  toate.extend(lot)
                  if len(lot) < 100:
                      break
              return toate

          # ——— Datele: pe integrări, apoi pe persoane ———
          raport = []
          for repo, nume in repos.items():
              item = {"repo": repo, "nume": nume, "url": f"https://github.com/{owner}/{repo}",
                      "forkuri": [], "eroare": None}
              try:
                  for fork in preia(repo):
                      autor = fork.get("owner") or {}
                      login = autor.get("login") or "necunoscut"
                      nume_fork = fork.get("name") or repo
                      item["forkuri"].append({
                          "login": login,
                          "profil": autor.get("html_url") or f"https://github.com/{login}",
                          "url": fork.get("html_url", ""),
                          "integrare": nume,
                          # numele tehnic apare doar când diferă de repo-ul tău
                          "redenumit": nume_fork if nume_fork.lower() != repo.lower() else None,
                          "created": datetime.fromisoformat(fork["created_at"].replace("Z", "+00:00")),
                      })
                  item["forkuri"].sort(key=lambda f: f["created"], reverse=True)
              except urllib.error.HTTPError as e:
                  item["eroare"] = "HTTP " + str(e.code)
              except Exception as e:
                  item["eroare"] = type(e).__name__
              for f in item["forkuri"]:
                  f["nou"] = f["created"] >= prag_nou
                  f["local"] = f["created"].astimezone(tz)
              raport.append(item)

          citite = [r for r in raport if not r["eroare"]]
          erori_lista = [r for r in raport if r["eroare"]]
          toate = sorted((f for r in citite for f in r["forkuri"]), key=lambda f: f["created"], reverse=True)
          noi_lista = [f for f in toate if f["nou"]]
          persoane = {}
          for f in toate:
              persoane.setdefault(f["login"], {"login": f["login"], "profil": f["profil"], "forkuri": []})["forkuri"].append(f)
          lista_pers = list(persoane.values())  # deja în ordinea celui mai recent fork
          total, noi, erori = len(toate), len(noi_lista), len(erori_lista)
          pers_noi = sum(1 for p in lista_pers if p["forkuri"][-1]["nou"])

          def numar(n, unu, mai_multe):
              """Acordul cu numărul: „1 fork”, „5 fork-uri”, „20 de fork-uri”."""
              if n == 1:
                  return f"1 {unu}"
              de = n % 100 >= 20 or (n >= 100 and n % 100 == 0)
              return f"{n} {'de ' if de else ''}{mai_multe}"

          def zi(d):
              return "azi" if d.date() == azi else "ieri" if d.date() == ieri else d.strftime("%d.%m.%Y")

          def cand(d):
              return f"{zi(d)}, {d:%H:%M}"

          if toate:
              z = toate[0]["local"].date()
              zile = (azi - z).days
              ultimul = ("azi", "") if z == azi else ("ieri", "") if z == ieri else (str(zile), numar(zile, "zi", "zile").split(" ", 1)[1])
              ultimul_text = ultimul[0] if not ultimul[1] else "acum " + numar(zile, "zi", "zile")
          else:
              ultimul, ultimul_text = ("—", ""), "—"

          # ——— Subiectul și previzualizarea din inbox: spun vestea ———
          if noi_lista:
              perechi = [f'{f["login"]} → {f["integrare"]}' for f in noi_lista[:2]]
              if noi == 1:
                  subiect = "Fork nou: " + perechi[0]
              else:
                  subiect = numar(noi, "fork nou", "fork-uri noi") + ": " + ", ".join(perechi)
                  subiect += f" și încă {noi - 2}" if noi > 2 else ""
              subiect += f" · {total} în total"
              f0 = noi_lista[0]
              preheader = f'{f0["login"]} a făcut fork la {f0["integrare"]} {zi(f0["local"])}, la {f0["local"]:%H:%M}'
              preheader += (", și încă " + numar(noi - 1, "fork", "fork-uri") + ".") if noi > 1 else "."
          else:
              subiect = "Fork-uri GitHub · nimic nou" + ("" if erori else f" · {total} în total")
              preheader = ("Ultimul fork a apărut " + ultimul_text + ".") if toate else "Niciun fork până acum."
          if erori:
              subiect += " · " + numar(erori, "integrare necitită", "integrări necitite")
              preheader = (f'{erori_lista[0]["nume"]} nu a putut fi citită ({erori_lista[0]["eroare"]}).' if erori == 1
                           else numar(erori, "integrare", "integrări") + " nu au putut fi citite.") + " " + preheader
          titlu = (numar(noi, "fork nou", "fork-uri noi") if noi else "Niciun fork nou") + " în ultimele 24 de ore"
          rulare = ""
          if os.getenv("GITHUB_RUN_ID"):
              rulare = (os.getenv("GITHUB_SERVER_URL", "https://github.com") + "/" + os.getenv("GITHUB_REPOSITORY", "")
                        + "/actions/runs/" + os.getenv("GITHUB_RUN_ID"))

          # ——— Textul simplu ———
          linii = ["hubinteligent · Fork-uri GitHub", "Raport zilnic · " + moment, "", titlu]
          for f in noi_lista:
              linii.append(f'  {f["login"]} a făcut fork la {f["integrare"]} · {cand(f["local"])} · {f["url"]}')
          for r in erori_lista:
              linii.append(f'  {r["nume"]} nu a putut fi citită ({r["eroare"]}); cifrele nu includ fork-urile ei.')
          linii += ["", f"Fork-uri: {total}" + (f" (+{noi})" if noi else "") + f" · Persoane: {len(lista_pers)}"
                    + (f" (+{pers_noi})" if pers_noi else "") + f" · Ultimul fork: {ultimul_text}", "", "CINE A FĂCUT FORK"]
          for p in lista_pers:
              fl = p["forkuri"]
              grupat = len(fl) > 1 and len({f["local"].date() for f in fl}) == 1
              linii.append(f'{p["login"]} · {numar(len(fl), "fork", "fork-uri")}' + (f' · {zi(fl[0]["local"])}' if grupat else "")
                           + f' · {p["profil"]}')
              for f in fl:
                  cand_txt = f["local"].strftime("%H:%M") if grupat else cand(f["local"])
                  linii.append(f'  {f["integrare"]}' + (" (nou)" if f["nou"] else "")
                               + (f' · redenumit {f["redenumit"]}' if f["redenumit"] else "")
                               + f' · {cand_txt} · {f["url"]}')
          if not lista_pers:
              linii.append("Niciun fork până acum.")
          linii += ["", "PE INTEGRĂRI"]
          ordine = sorted(raport, key=lambda r: (-len(r["forkuri"]), r["nume"]))
          for r in ordine:
              linii.append(f'  {r["nume"]}: ' + (f'nu s-a putut citi ({r["eroare"]})' if r["eroare"] else str(len(r["forkuri"]))))
          linii += ["", "—", "Trimis automat de GitHub Actions" + (": " + rulare if rulare else "")]
          with open("forkuri.txt", "w", encoding="utf-8") as fis:
              fis.write("\n".join(linii) + "\n")

          # ——— HTML: tiparele și tokenii emailurilor hubinteligent (core/contrib_mail.py) ———
          # Registru de contoare: IBM Plex Sans, cifrele în Plex Mono, un singur accent albastru (fork nou),
          # roșu doar pentru o integrare necitită. Tabele cu stiluri inline; dark mode și telefon prin clase.
          SANS = "'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          MONO = "'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          FONTS_URL = ("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500"
                       "&family=IBM+Plex+Sans:wght@400;500;600&display=swap")
          CANVAS, SURFACE, SURFACE_UP = "#fafafa", "#ffffff", "#f7f7f8"
          LINE = "#dfdfe2"
          INK, INK_SOFT, INK_MUTED, INK_FAINT = "#17171c", "#3e3e46", "#67676f", "#909098"
          SIGNAL, EROARE, MONOGRAMA = "#0e65f1", "#c42b1c", "#f0f0f2"
          CLASA = {INK: "c-ink", INK_SOFT: "c-soft", INK_MUTED: "c-muted", INK_FAINT: "c-faint",
                   SIGNAL: "c-sig", EROARE: "c-err"}
          INALTIME = {11: 16, 12: 18, 13: 20, 14: 22, 18: 26, 22: 30}
          TABEL = 'role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"'
          LOGO_URL = "https://hubinteligent.org/logo-email.png"
          CSS = (
              ":root{color-scheme:light dark;supported-color-schemes:light dark;}"
              "body{margin:0;padding:0;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;}"
              "a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;}"
              "@media only screen and (max-width:600px){.wrap{padding:12px!important;}.px{padding:18px 16px!important;}"
              ".pxh{padding:14px 16px!important;}.lc,.lk{display:block!important;width:100%!important;}"
              ".lk{text-align:left!important;padding-left:0!important;}.rn{display:block!important;padding-left:0!important;}"
              ".fr td{padding-top:6px!important;padding-bottom:6px!important;}"
              ".ir{padding-top:9px!important;padding-bottom:9px!important;}"
              ".cit{padding:8px 10px 10px!important;}.val{font-size:18px!important;line-height:26px!important;}}"
              "@media (prefers-color-scheme:dark){"
              ".c-canvas{background:#111113!important;}"
              ".c-surface{background:#1a1a1c!important;border-color:#28282a!important;}"
              ".c-up{background:#202022!important;}.c-line{border-color:#28282a!important;}"
              ".c-ink{color:#f4f4f5!important;}.c-soft{color:#cfcfd3!important;}"
              ".c-muted{color:#a0a0a7!important;}.c-faint{color:#71717a!important;}"
              ".c-sig{color:#488af4!important;}.c-sigb{border-color:#488af4!important;}.c-err{color:#f47067!important;}"
              ".c-warn{border-color:#28282a!important;border-left-color:#f47067!important;}"
              ".c-mg{background:#26262a!important;color:#cfcfd3!important;}.c-logo{background:#488af4!important;}"
              "}"
          )
          MSO = ("<!--[if mso]><style>body,table,td,p,a,span,h1,h2{font-family:'Segoe UI',Arial,sans-serif!important;}"
                 ".m{font-family:Consolas,'Courier New',monospace!important;}</style><![endif]-->")

          def esc(v):
              return html.escape(str(v), quote=True)

          def nb(v):
              """Nume compuse care nu se rup pe două rânduri („Nova Power & Gas”, „HTTP 403”)."""
              return esc(v).replace(" ", "&nbsp;")

          def txt(size, color, weight=400, extra="", mono=False, cls=""):
              c = " ".join(x for x in (CLASA.get(color, ""), "m" if mono else "", cls) if x)
              font = f"font-family:{MONO};font-variant-numeric:tabular-nums;" if mono else f"font-family:{SANS};"
              return (f'class="{c}" style="margin:0;{font}font-size:{size}px;line-height:{INALTIME[size]}px;'
                      f'color:{color};font-weight:{weight};{extra}"')

          def p(continut, size, color, weight=400, extra="", mono=False, cls="", tag="p"):
              return f"<{tag} {txt(size, color, weight, extra, mono, cls)}>{continut}</{tag}>"

          def link(url, eticheta, color, weight=500, extra=""):
              return (f'<a href="{esc(url)}" class="{CLASA.get(color, "")}" translate="no" '
                      f'style="color:{color};text-decoration:none;font-weight:{weight};{extra}">{eticheta}</a>')

          def mono(v):
              return f'<span class="m" style="font-family:{MONO};font-variant-numeric:tabular-nums;">{v}</span>'

          def numar_html(n, unu, mai_multe):
              cuvinte = numar(n, unu, mai_multe).split(" ", 1)[1]
              return mono(n) + " " + esc(cuvinte)

          def monograma(login):
              return (f'<table role="presentation" cellpadding="0" cellspacing="0" border="0" aria-hidden="true"><tr>'
                      f'<td class="c-mg" width="28" height="28" align="center" valign="middle" bgcolor="{MONOGRAMA}" '
                      f'style="width:28px;height:28px;border-radius:14px;background:{MONOGRAMA};font-family:{SANS};'
                      f'font-size:12px;line-height:28px;font-weight:600;color:{INK_SOFT};text-align:center;">'
                      f'{esc((login[:1] or "?").upper())}</td></tr></table>')

          ETICHETA_NOU = (f'<span class="c-sig c-sigb m" style="display:inline-block;margin-left:6px;padding:0 5px;'
                          f'border:1px solid {SIGNAL};border-radius:4px;font-family:{MONO};font-size:11px;line-height:16px;'
                          f'font-weight:500;color:{SIGNAL};vertical-align:1px;">nou</span>')
          SEP = f'<span class="c-faint" style="color:{INK_FAINT};">&nbsp;&nbsp;·&nbsp;&nbsp;</span>'

          # Antetul, ca în emailurile site-ului: marca și numele în stânga, eticheta emailului în dreapta
          marca = (f'<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>'
                   f'<td class="c-logo" width="22" height="22" align="center" valign="middle" bgcolor="{SIGNAL}" '
                   f'style="width:22px;height:22px;border-radius:7px;background:{SIGNAL};">'
                   f'<img src="{LOGO_URL}" width="22" height="22" alt="h" style="display:block;width:22px;height:22px;'
                   f'border:0;border-radius:7px;font-family:{SANS};font-size:14px;line-height:22px;font-weight:600;'
                   f'color:#ffffff;text-align:center;"></td></tr></table>')
          antet = (f'<tr><td class="pxh c-line" style="padding:16px 24px;border-bottom:1px solid {LINE};">'
                   f'<table {TABEL}><tr><td valign="middle" style="width:22px;">{marca}</td>'
                   f'<td valign="middle" style="padding-left:10px;"><span class="c-ink" translate="no" style="font-family:{SANS};'
                   f'font-size:14px;line-height:20px;font-weight:600;color:{INK};letter-spacing:-0.01em;">hubinteligent</span></td>'
                   f'<td align="right" valign="middle">{p("Fork-uri GitHub", 12, INK_MUTED, 500, tag="span")}</td>'
                   f'</tr></table></td></tr>')

          # 1. Starea zilei: singurul punct focal
          s1 = p("Raport zilnic · " + mono(esc(moment)), 12, INK_MUTED)
          s1 += p(esc(titlu), 18, INK, 600, "padding-top:4px;letter-spacing:-0.015em;", tag="h1")
          if noi_lista:
              randuri = ""
              for k, f in enumerate(noi_lista):
                  bord = f"border-top:1px solid {LINE};" if k else ""
                  propozitie = (link(f["profil"], esc(f["login"]), INK, 600) + " a făcut fork la "
                                + link(f["url"], nb(f["integrare"]), INK, 600))
                  randuri += (f'<tr><td class="c-line" style="padding:10px 0;{bord}"><table {TABEL}><tr>'
                              f'<td width="28" valign="middle" style="width:28px;">{monograma(f["login"])}</td>'
                              f'<td valign="middle" style="padding-left:12px;">{p(propozitie, 14, INK_SOFT)}</td>'
                              f'<td valign="middle" align="right" style="padding-left:8px;white-space:nowrap;">'
                              f'{p(esc(cand(f["local"])), 12, INK_MUTED, mono=True)}</td></tr></table></td></tr>')
              s1 += (f'<table {TABEL} class="c-sigb" style="margin-top:16px;border:1px solid {SIGNAL};border-radius:10px;'
                     f'border-collapse:separate;"><tr><td style="padding:4px 14px;"><table {TABEL}>{randuri}</table></td></tr></table>')
          if erori_lista:
              if erori == 1:
                  r = erori_lista[0]
                  mesaj = (f'<b class="c-ink" style="color:{INK};font-weight:600;" translate="no">{nb(r["nume"])}</b> '
                           f'nu a putut fi citită ({mono(nb(r["eroare"]))}), așa că cifrele de mai jos nu includ fork-urile ei.')
              else:
                  mesaj = ("Nu au putut fi citite: " + ", ".join(
                      f'<b class="c-ink" style="color:{INK};font-weight:600;" translate="no">{nb(r["nume"])}</b> '
                      f'({mono(nb(r["eroare"]))})' for r in erori_lista) + ". Cifrele de mai jos nu includ fork-urile lor.")
              s1 += (f'<table {TABEL} class="c-warn" style="margin-top:12px;border:1px solid {LINE};border-left:3px solid {EROARE};'
                     f'border-radius:10px;border-collapse:separate;"><tr><td style="padding:10px 14px;">'
                     f'{p(mesaj, 13, INK_SOFT)}</td></tr></table>')

          def valoare(cifra, unitate="", delta=0):
              v = (f'<p class="c-ink m val" style="margin:0;font-family:{MONO};font-variant-numeric:tabular-nums;font-size:22px;'
                   f'line-height:30px;font-weight:500;color:{INK};letter-spacing:-0.02em;white-space:nowrap;">{esc(cifra)}')
              if unitate:
                  v += (f'<span class="c-muted" style="font-family:{SANS};font-size:13px;font-weight:400;color:{INK_MUTED};'
                        f'letter-spacing:0;">&nbsp;{esc(unitate)}</span>')
              if delta:
                  v += (f'<span class="c-sig" style="font-size:12px;font-weight:500;color:{SIGNAL};letter-spacing:0;'
                        f'vertical-align:2px;">&nbsp;+{delta}</span>')
              return v + "</p>"

          def cuvant(w):
              return (f'<p class="c-ink val" style="margin:0;font-family:{SANS};font-size:18px;line-height:30px;font-weight:500;'
                      f'color:{INK};white-space:nowrap;">{esc(w)}</p>')

          citiri = [("Fork-uri", valoare(total, delta=noi)),
                    ("Persoane", valoare(len(lista_pers), delta=pers_noi)),
                    ("Ultimul fork", valoare(ultimul[0], ultimul[1]) if ultimul[1] else cuvant(ultimul[0]))]
          celule = "".join(
              f'<td class="cit c-line" width="33%" valign="top" style="padding:10px 14px 12px;'
              f'{"border-left:1px solid " + LINE + ";" if k else ""}">{p(et, 12, INK_MUTED)}{v}</td>'
              for k, (et, v) in enumerate(citiri))
          s1 += (f'<table {TABEL} class="c-line" style="margin-top:16px;border:1px solid {LINE};border-radius:10px;'
                 f'border-collapse:separate;"><tr>{celule}</tr></table>')

          # 2. Cine a făcut fork: grupat pe persoană, persoana în față
          s2 = p("Cine a făcut fork", 14, INK, 600, tag="h2")
          s2 += p("Cele mai recente primele. Numele deschide profilul, integrarea deschide fork-ul.", 13, INK_MUTED,
                  extra="padding-top:2px;")
          blocuri = ""
          for k, pers in enumerate(lista_pers):
              fl = pers["forkuri"]
              grupat = len(fl) > 1 and len({f["local"].date() for f in fl}) == 1
              meta = numar_html(len(fl), "fork", "fork-uri")
              if grupat:
                  z = zi(fl[0]["local"])
                  meta += " · " + (esc(z) if z in ("azi", "ieri") else mono(z))
              randuri = ""
              for f in fl:
                  nume = link(f["url"], nb(f["integrare"]), INK_SOFT, 500) + (ETICHETA_NOU if f["nou"] else "")
                  if f["redenumit"]:
                      nume += (f'<span class="rn c-muted m" translate="no" style="font-family:{MONO};font-size:11px;'
                               f'color:{INK_MUTED};padding-left:8px;word-break:break-word;overflow-wrap:anywhere;">redenumit {esc(f["redenumit"])}</span>')
                  cand_txt = f["local"].strftime("%H:%M") if grupat else cand(f["local"])
                  randuri += (f'<tr class="fr"><td valign="top" style="padding:3px 0;">{p(nume, 14, INK_SOFT)}</td>'
                              f'<td valign="top" align="right" style="padding:3px 0 3px 8px;white-space:nowrap;">'
                              f'{p(esc(cand_txt), 12, INK_MUTED, extra="line-height:22px;", mono=True)}</td></tr>')
              bord = f"border-top:1px solid {LINE};" if k else ""
              blocuri += (f'<tr><td class="c-line" style="padding:14px 0;{bord}"><table {TABEL}>'
                          f'<tr><td width="28" valign="middle" style="width:28px;">{monograma(pers["login"])}</td>'
                          f'<td valign="middle" style="padding-left:12px;"><table {TABEL}><tr>'
                          f'<td class="lc" valign="middle">'
                          f'{p(link(pers["profil"], esc(pers["login"]), INK, 600, "word-break:break-word;"), 14, INK)}</td>'
                          f'<td class="lk" valign="middle" align="right" style="padding-left:12px;white-space:nowrap;">'
                          f'{p(meta, 12, INK_MUTED)}</td></tr></table></td></tr>'
                          f'<tr><td></td><td style="padding:4px 0 0 12px;"><table {TABEL}>{randuri}</table></td></tr>'
                          f'</table></td></tr>')
          if blocuri:
              s2 += f'<table {TABEL} style="margin-top:4px;">{blocuri}</table>'
          else:
              s2 += p("Niciun fork până acum.", 14, INK_SOFT, extra="padding-top:12px;")

          # 3. Pe integrări: o singură dată, fără detalii repetate
          s3 = p("Pe integrări", 14, INK, 600, tag="h2")
          randuri = ""
          for k, r in enumerate(ordine):
              bord = f"border-top:1px solid {LINE};" if k else ""
              if r["eroare"]:
                  dreapta = p("nu s-a putut citi · " + mono(nb(r["eroare"])), 12, EROARE)
              else:
                  n = len(r["forkuri"])
                  plus = sum(f["nou"] for f in r["forkuri"])
                  semn = (f'<span class="c-sig" style="font-size:12px;color:{SIGNAL};">+{plus}</span>&nbsp;&nbsp;' if plus else "")
                  dreapta = p(semn + str(n), 13, INK if n else INK_FAINT, 500, mono=True)
              randuri += (f'<tr><td class="ir c-line" valign="middle" style="padding:7px 0;{bord}">'
                          f'{p(link(r["url"] + "/forks", nb(r["nume"]), INK_SOFT, 500), 14, INK_SOFT)}</td>'
                          f'<td class="ir c-line" valign="middle" align="right" style="padding:7px 0 7px 12px;{bord}'
                          f'white-space:nowrap;">{dreapta}</td></tr>')
          s3 += f'<table {TABEL} style="margin-top:8px;">{randuri}</table>'

          corp = antet + "".join(
              f'<tr><td class="px c-line" style="padding:20px 24px;{"border-top:1px solid " + LINE + ";" if k else ""}">{s}</td></tr>'
              for k, s in enumerate([s1, s2, s3]))
          subsol = "Trimis automat de GitHub&nbsp;Actions" + (SEP + link(rulare, "Vezi rularea", INK_SOFT, 500) if rulare else "")
          corp += (f'<tr><td class="px c-up c-line" align="center" bgcolor="{SURFACE_UP}" style="padding:14px 24px;'
                   f'background:{SURFACE_UP};border-top:1px solid {LINE};border-radius:0 0 13px 13px;">'
                   f'{p(subsol, 12, INK_MUTED)}</td></tr>')
          pagina = (
              '<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width,initial-scale=1">'
              '<meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark">'
              '<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">'
              f'<title>{esc(subiect)}</title><link rel="stylesheet" href="{FONTS_URL}"><style>{CSS}</style>{MSO}</head>'
              f'<body class="c-canvas" style="margin:0;padding:0;background:{CANVAS};">'
              '<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:transparent;">'
              + esc(preheader) + "&#847;&zwnj;&nbsp;" * 60 + '</div>'
              f'<table {TABEL} class="c-canvas" bgcolor="{CANVAS}" style="background:{CANVAS};">'
              '<tr><td align="center" class="wrap" style="padding:32px 16px;">'
              f'<table {TABEL} class="c-surface" bgcolor="{SURFACE}" style="max-width:560px;background:{SURFACE};'
              f'border:1px solid {LINE};border-radius:14px;border-collapse:separate;">' + corp + '</table>'
              '</td></tr></table></body></html>'
          )
          with open("forkuri.html", "w", encoding="utf-8") as fis:
              fis.write(pagina)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fis:
              fis.write("subject=" + subiect + "\n")

          # ——— Rezumatul rulării din GitHub Actions ———
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fis:
              fis.write(f"### {subiect}\n\n{moment}\n\n| Integrare | Fork-uri | Noi (24h) |\n|---|---:|---:|\n")
              for r in ordine:
                  if r["eroare"]:
                      fis.write(f'| [{r["nume"]}]({r["url"]}/forks) | eroare: {r["eroare"]} | |\n')
                  else:
                      fis.write(f'| [{r["nume"]}]({r["url"]}/forks) | {len(r["forkuri"])} | '
                                f'{sum(f["nou"] for f in r["forkuri"]) or ""} |\n')
              fis.write("\n#### Cine a făcut fork\n\n")
              for pers in lista_pers:
                  fis.write(f'- **[{pers["login"]}]({pers["profil"]})** · {numar(len(pers["forkuri"]), "fork", "fork-uri")}\n')
                  for f in pers["forkuri"]:
                      fis.write(f'  - [{f["integrare"]}]({f["url"]}) · {cand(f["local"])}'
                                + (f' · redenumit `{f["redenumit"]}`' if f["redenumit"] else "")
                                + (" · **nou**" if f["nou"] else "") + "\n")
              if not lista_pers:
                  fis.write("Niciun fork până acum.\n")
          print(subiect)
          PYTHONEOF

      - name: Trimite email folosind configurarea existentă
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DKIM_KEY: ${{ secrets.DKIM_GITHUB_KEY }}
          SUBIECT: ${{ steps.raport.outputs.subject }}
        run: |
          if [ -n "$DKIM_KEY" ]; then
            { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-dkim; } >/dev/null \
              || echo "::warning::Nu am putut instala python3-dkim"
          fi
          /usr/bin/python3 << 'PYTHONEOF'
          import os
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.utils import formatdate, getaddresses, make_msgid

          DOMENIU = "hubinteligent.org"
          SELECTOR = "github2026"
          EXPEDITOR = "github@" + DOMENIU
          ANTETE = [b"from", b"to", b"subject", b"date", b"message-id", b"mime-version", b"content-type"]
          destinatari = [adresa for _, adresa in getaddresses([os.environ["EMAIL_TO"]]) if adresa]
          mesaj = MIMEMultipart("alternative")
          mesaj["From"] = "GitHub Workflows <" + EXPEDITOR + ">"
          mesaj["To"] = ", ".join(destinatari)
          mesaj["Subject"] = os.environ["SUBIECT"]
          mesaj["Date"] = formatdate(localtime=True)
          mesaj["Message-ID"] = make_msgid(domain=DOMENIU)
          mesaj.attach(MIMEText(open("forkuri.txt", encoding="utf-8").read(), "plain", "utf-8"))
          mesaj.attach(MIMEText(open("forkuri.html", encoding="utf-8").read(), "html", "utf-8"))
          raw = mesaj.as_bytes(policy=mesaj.policy.clone(linesep="\r\n"))
          cheie = os.environ.get("DKIM_KEY", "").replace("\r\n", "\n").strip().encode()
          if cheie:
              try:
                  import dkim
                  semnatura = dkim.sign(raw, SELECTOR.encode(), DOMENIU.encode(), cheie + b"\n",
                                        canonicalize=(b"relaxed", b"relaxed"), include_headers=ANTETE)
                  data = semnatura + raw
              except Exception as e:
                  print("::warning::Semnarea DKIM a eșuat: " + type(e).__name__)
                  data = raw
          else:
              print("::warning::Lipsește secretul DKIM_GITHUB_KEY; emailul va fi nesemnat.")
              data = raw
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=60) as smtp:
              smtp.login(os.environ["EMAIL_USER"], os.environ["EMAIL_PASS"])
              smtp.sendmail(EXPEDITOR, destinatari, data)
          print("Email trimis către destinatarii configurați în EMAIL_TO.")
          PYTHONEOF
