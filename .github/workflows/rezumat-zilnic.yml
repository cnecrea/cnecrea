name: Rezumat zilnic probleme deschise

on:
  schedule:
    # Luni–vineri la 08:00 UTC (10:00 ora României iarna, 11:00 vara)
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  issues: read

jobs:
  rezumat-probleme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Doar biblioteca standard Python 3 de pe runner: fără checkout, setup-python sau pip
      - name: Generează rezumatul
        id: rezumat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHONEOF'
          import html
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          owner = "cnecrea"

          repos = {
              "cursbnr":         ("Curs BNR",         "https://github.com/cnecrea/cursbnr"),
              "e-bloc.ro":       ("E-bloc România",   "https://github.com/cnecrea/e-bloc.ro"),
              "eonromania":      ("E.ON România",     "https://github.com/cnecrea/eonromania"),
              "erovinieta":      ("CNAIR eRovinieta", "https://github.com/cnecrea/erovinieta"),
              "tollro":          ("CNAIR eToll",      "https://github.com/cnecrea/tollro"),
              "hidroelectrica":  ("Hidroelectrica",   "https://github.com/cnecrea/hidroelectrica"),
              "fleet":           ("Manager de flotă", "https://github.com/cnecrea/fleet"),
              "myelectrica":     ("MyElectrica",      "https://github.com/cnecrea/myelectrica"),
              "myengie":         ("MyENGIE",          "https://github.com/cnecrea/myengie"),
              "vreaulanova":     ("Nova Power & Gas", "https://github.com/cnecrea/vreaulanova"),
              "opcom":           ("OPCOM",            "https://github.com/cnecrea/opcom"),
              "pagoplateste":    ("Pago Plătește",    "https://github.com/cnecrea/pagoplateste"),
              "reteleelectrice": ("Rețele Electrice", "https://github.com/cnecrea/reteleelectrice"),
              "smsto":           ("SMS.to",           "https://github.com/cnecrea/smsto"),
              "vehicule":        ("Vehicule",         "https://github.com/cnecrea/vehicule"),
          }

          # ── Timp ────────────────────────────────────────────────────────────
          acum = datetime.now(timezone.utc)
          acum_ro = acum.astimezone(ZoneInfo("Europe/Bucharest"))
          # „Nou" = apărut de la raportul anterior; lunea acoperă și weekendul
          prag_nou = acum - timedelta(hours=72 if acum_ro.weekday() == 0 else 24)
          prag_inactiv = 30  # zile fără activitate

          luni = ["ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie",
                  "august", "septembrie", "octombrie", "noiembrie", "decembrie"]
          zile_sapt = ["luni", "marți", "miercuri", "joi", "vineri", "sâmbătă", "duminică"]
          azi = (zile_sapt[acum_ro.weekday()] + ", " + str(acum_ro.day) + " "
                 + luni[acum_ro.month - 1] + " " + str(acum_ro.year))
          ora = acum_ro.strftime("%H:%M")

          # ── Text în română ──────────────────────────────────────────────────
          def forma(n, unu, multe):
              """1 problemă · 2 probleme · 20 de probleme"""
              if n == 1:
                  return unu
              if n and (n % 100 == 0 or n % 100 >= 20):
                  return "de " + multe
              return multe

          def numar(n, unu, multe):
              return str(n) + " " + forma(n, unu, multe)

          def vechime(moment):
              ore = int((acum - moment).total_seconds() // 3600)
              z = ore // 24
              if ore < 1:
                  return "acum câteva minute"
              if ore < 24:
                  return "acum o oră" if ore == 1 else "acum " + numar(ore, "oră", "ore")
              if z < 2:
                  return "ieri"
              if z < 30:
                  return "acum " + numar(z, "zi", "zile")
              if z < 365:
                  l = z // 30
                  return "acum o lună" if l == 1 else "acum " + numar(l, "lună", "luni")
              a = z // 365
              return "acum un an" if a == 1 else "acum " + numar(a, "an", "ani")

          def esc(s):
              return html.escape(str(s), quote=True)

          def lipit(s):
              """Text care nu se rupe pe rânduri; listele se rup doar după „·"."""
              return s.replace(" ", "&nbsp;")

          PUNCT = "&nbsp;&middot; "

          def data_gh(s):
              return datetime.fromisoformat(s.replace("Z", "+00:00"))

          # ── Preluare din GitHub ─────────────────────────────────────────────
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rezumat-zilnic",
          }
          token = os.getenv("GITHUB_TOKEN")
          if token:
              headers["Authorization"] = "Bearer " + token

          def preia(repo_key):
              toate = []
              for pagina in range(1, 11):
                  url = ("https://api.github.com/repos/" + owner + "/" + repo_key
                         + "/issues?state=open&per_page=100&page=" + str(pagina))
                  cerere = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(cerere, timeout=15) as r:
                      lot = json.load(r)
                  toate.extend(lot)
                  if len(lot) < 100:
                      break
              return toate

          integrari = []
          for repo_key, (nume, link) in repos.items():
              intrare = {"nume": nume, "link": link, "probleme": [], "pr": [], "eroare": None}
              elemente = []
              try:
                  elemente = preia(repo_key)
              except urllib.error.HTTPError as e:
                  intrare["eroare"] = "HTTP " + str(e.code)
              except Exception as e:
                  intrare["eroare"] = type(e).__name__
              if intrare["eroare"]:
                  print("Eroare la " + repo_key + ": " + intrare["eroare"])
              for it in elemente:
                  este_pr = "pull_request" in it  # API-ul de issues întoarce și PR-urile
                  creat = data_gh(it["created_at"])
                  intrare["pr" if este_pr else "probleme"].append({
                      "numar": it["number"],
                      "titlu": it["title"],
                      "url": it["html_url"],
                      "autor": (it.get("user") or {}).get("login", "ghost"),
                      "etichete": [(lb["name"], lb.get("color") or "8c959f")
                                   for lb in it.get("labels", [])],
                      "creat": creat,
                      "comentarii": it.get("comments", 0),
                      "nou": creat >= prag_nou,
                      "inactiv": (acum - data_gh(it["updated_at"])).days,
                      "este_pr": este_pr,
                  })
              for lista in (intrare["probleme"], intrare["pr"]):
                  lista.sort(key=lambda p: p["creat"], reverse=True)
              integrari.append(intrare)

          total = sum(len(i["probleme"]) for i in integrari)
          total_pr = sum(len(i["pr"]) for i in integrari)
          noi = sum(p["nou"] for i in integrari for p in i["probleme"] + i["pr"])
          erori = sum(1 for i in integrari if i["eroare"])
          cu_probleme_n = sum(1 for i in integrari if i["probleme"])

          # Cele cu ceva de văzut primele, cele mai încărcate sus; restul pe un rând
          cu_probleme = sorted(
              (i for i in integrari if i["probleme"] or i["pr"] or i["eroare"]),
              key=lambda i: (-len(i["probleme"]), -len(i["pr"])))
          fara = [i for i in integrari if not (i["probleme"] or i["pr"] or i["eroare"])]

          # ── Design ──────────────────────────────────────────────────────────
          # Neutre reci, adâncime doar din borduri, un singur accent (atenție).
          # Semnătura: pătrățele în stil diffstat GitHub pentru încărcare.
          SANS = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          MONO = "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          FUNDAL, CARD, LINIE = "#f2f4f7", "#ffffff", "#e3e7ec"
          TEXT, TEXT_2, TEXT_3 = "#16202c", "#4a5565", "#677283"
          ACCENT, GOL, EROARE = "#c2410c", "#e3e7ec", "#b42318"
          INALTIME = {11: 16, 12: 16, 13: 20, 14: 20, 15: 22, 16: 24}
          CLASA = {TEXT: "c-t1", TEXT_2: "c-t2", TEXT_3: "c-t3", ACCENT: "c-acc", EROARE: "c-err"}

          def txt(marime, culoare, greutate=400, extra="", clase=""):
              """Atribute class + style pentru text; clasele schimbă culorile în dark mode."""
              cls = (CLASA.get(culoare, "") + " " + clase).strip()
              stil = ("margin:0;font-family:" + SANS + ";font-size:" + str(marime) + "px;"
                      "line-height:" + str(INALTIME[marime]) + "px;color:" + culoare + ";"
                      "font-weight:" + str(greutate) + ";" + extra)
              return 'class="' + cls + '" style="' + stil + '"'

          def titlu_sectiune(text):
              return ('<p ' + txt(11, TEXT_3, 600, "letter-spacing:0.08em;text-transform:uppercase;")
                      + '>' + text + '</p>')

          def patrate(celule, marime=8, spatiu=3, align=""):
              """celule = [(plin, titlu)] — un pătrățel pentru fiecare."""
              td = []
              for k, (plin, titlu) in enumerate(celule):
                  if k:
                      td.append('<td width="' + str(spatiu) + '" style="width:' + str(spatiu)
                                + 'px;font-size:0;line-height:0;">&nbsp;</td>')
                  cls, culoare = ("c-plin", ACCENT) if plin else ("c-gol", GOL)
                  t = ' title="' + esc(titlu) + '"' if titlu else ""
                  td.append('<td class="' + cls + '" width="' + str(marime) + '" height="'
                            + str(marime) + '" bgcolor="' + culoare + '"' + t
                            + ' style="width:' + str(marime) + 'px;height:' + str(marime)
                            + 'px;background:' + culoare
                            + ';border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>')
              a = ' align="' + align + '"' if align else ""
              return ('<table role="presentation" cellpadding="0" cellspacing="0" border="0"' + a
                      + '><tr>' + "".join(td) + '</tr></table>')

          def hex_rgb(h):
              h = h.lstrip("#")
              if len(h) != 6:
                  h = "8c959f"
              return tuple(int(h[k:k + 2], 16) for k in (0, 2, 4))

          def rgb_hex(c):
              return "#%02x%02x%02x" % c

          def amesteca(a, b, p):
              return tuple(round(x * p + y * (1 - p)) for x, y in zip(a, b))

          def luminanta(c):
              def canal(v):
                  v /= 255
                  return v / 12.92 if v <= 0.03928 else ((v + 0.055) / 1.055) ** 2.4
              r, g, b = (canal(v) for v in c)
              return 0.2126 * r + 0.7152 * g + 0.0722 * b

          def contrast(a, b):
              la, lb = sorted((luminanta(a), luminanta(b)), reverse=True)
              return (la + 0.05) / (lb + 0.05)

          def eticheta(nume, culoare):
              """Eticheta GitHub: nuanța ei pe fundal deschis, text închis până la contrast 4.5:1."""
              baza = hex_rgb(culoare)
              fundal = amesteca(baza, (255, 255, 255), 0.14)
              margine = amesteca(baza, (255, 255, 255), 0.40)
              text = baza
              while contrast(text, fundal) < 4.5:
                  text = amesteca(text, (0, 0, 0), 0.85)
              return ('<span style="display:inline-block;margin:4px 4px 0 0;padding:0 8px;'
                      'border:1px solid ' + rgb_hex(margine) + ';border-radius:999px;'
                      'background:' + rgb_hex(fundal) + ';font-family:' + SANS + ';font-size:11px;'
                      'line-height:18px;font-weight:500;color:' + rgb_hex(text)
                      + ';white-space:nowrap;">' + esc(nume) + '</span>')

          INSIGNA_NOU = ('<span class="c-plin" style="display:inline-block;padding:0 6px;'
                         'border-radius:999px;background:' + ACCENT + ';font-family:' + SANS + ';'
                         'font-size:11px;line-height:16px;font-weight:600;color:#ffffff;'
                         'vertical-align:2px;">nou</span>')
          INSIGNA_PR = ('<span class="c-t2 c-linie" style="display:inline-block;padding:0 5px;'
                        'border:1px solid ' + LINIE + ';border-radius:4px;font-family:' + MONO + ';'
                        'font-size:11px;line-height:16px;font-weight:600;color:' + TEXT_2 + ';'
                        'vertical-align:2px;">PR</span>')

          def link(href, text, culoare, extra=""):
              return ('<a href="' + esc(href) + '" class="' + CLASA[culoare] + '" style="color:'
                      + culoare + ';text-decoration:none;' + extra + '">' + text + '</a>')

          def element(p):
              meta = ['<span style="font-family:' + MONO + ';">#' + str(p["numar"]) + '</span>',
                      "@" + esc(p["autor"]),
                      lipit(("deschis " if p["este_pr"] else "deschisă ") + vechime(p["creat"]))]
              if p["comentarii"]:
                  meta.append(lipit(numar(p["comentarii"], "comentariu", "comentarii")))
              if p["inactiv"] >= prag_inactiv:
                  meta.append(lipit("fără activitate de " + numar(p["inactiv"], "zi", "zile")))
              etichete = "".join(eticheta(n, c) for n, c in p["etichete"])
              return (
                  '<tr><td class="c-linie" style="padding:12px 0;border-top:1px solid ' + LINIE + ';">'
                  '<p ' + txt(15, TEXT, 600) + '>'
                  + (INSIGNA_PR + "&nbsp; " if p["este_pr"] else "")
                  + link(p["url"], esc(p["titlu"]), TEXT)
                  + ("&nbsp; " + INSIGNA_NOU if p["nou"] else "") + '</p>'
                  '<p ' + txt(13, TEXT_3, extra="padding-top:4px;") + '>'
                  + PUNCT.join(meta) + '</p>'
                  + ('<div style="padding-top:4px;font-size:0;line-height:0;">' + etichete + '</div>'
                     if etichete else "")
                  + '</td></tr>'
              )

          TABEL = 'role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"'

          # Secțiunea 1: antet + cifra principală
          piese = []  # (html, text)
          if total:
              s = "în " + str(cu_probleme_n) + " din " + numar(len(repos), "integrare", "integrări")
              piese.append((lipit(s), s))
          elif not erori:
              s = "toate cele " + numar(len(repos), "integrare", "integrări") + " sunt în ordine"
              piese.append((s, s))
          if noi:
              s = numar(noi, "nouă", "noi") + " de la ultimul raport"
              piese.append(('<span class="c-acc" style="color:' + ACCENT + ';font-weight:600;">'
                            + lipit(s) + '</span>', s))
          if total_pr:
              s = numar(total_pr, "PR deschis", "PR-uri deschise")
              piese.append((lipit(s), s))
          if erori:
              s = numar(erori, "integrare necitită", "integrări necitite")
              piese.append(('<span class="c-err" style="color:' + EROARE + ';font-weight:600;">'
                            + lipit(s) + '</span>', s))

          banda = [(bool(i["probleme"]), i["nume"] + ": " + numar(len(i["probleme"]), "problemă", "probleme"))
                   for i in sorted(integrari, key=lambda i: -len(i["probleme"]))]
          meta_hero = PUNCT.join(h for h, _ in piese)

          sectiune_hero = (
              titlu_sectiune("Rezumat zilnic")
              + '<p ' + txt(13, TEXT_3, extra="padding-top:4px;") + '>' + azi + ' &middot; ' + ora + '</p>'
              + '<p ' + txt(16, TEXT_2, extra="padding-top:24px;") + '>'
              '<span class="c-t1" style="font-size:44px;line-height:48px;font-weight:700;color:' + TEXT + ';'
              'letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">' + str(total) + '</span>'
              '&nbsp;' + forma(total, "problemă deschisă", "probleme deschise") + '</p>'
              '<div style="padding-top:16px;">' + patrate(banda, 10, 4) + '</div>'
              '<p ' + txt(13, TEXT_2, extra="padding-top:12px;") + '>'
              + meta_hero[:1].upper() + meta_hero[1:] + '</p>'
          )

          # Secțiunea 2: integrările cu ceva deschis; cele curate pe un singur rând
          randuri = ""
          for k, i in enumerate(cu_probleme):
              n = len(i["probleme"])
              celula = ('class="c-linie" style="padding:12px 0;'
                        + ("border-top:1px solid " + LINIE + ";" if k else "") + '"')
              nume = link(i["link"], lipit(esc(i["nume"])), TEXT, "font-weight:500;")
              if i["pr"]:
                  nume += ('<span class="c-t3" style="color:' + TEXT_3 + ';">' + PUNCT
                           + lipit(numar(len(i["pr"]), "PR", "PR-uri")) + '</span>')
              if i["eroare"]:
                  dreapta = ('<td ' + celula + ' align="right" colspan="2"><span '
                             + txt(13, EROARE, 500, "white-space:nowrap;") + '>nu s-a putut citi ('
                             + esc(i["eroare"]) + ')</span></td>')
              else:
                  dreapta = (
                      '<td ' + celula + ' align="right" width="64">'
                      + patrate([(x < n, None) for x in range(5)], align="right") + '</td>'
                      '<td ' + celula + ' align="right" width="40"><span '
                      + txt(14, TEXT if n else TEXT_3, 600, "font-variant-numeric:tabular-nums;")
                      + '>' + str(n) + '</span></td>'
                  )
              randuri += ('<tr><td ' + celula + '><span ' + txt(14, TEXT) + '>' + nume
                          + '</span></td>' + dreapta + '</tr>')

          sectiune_integrari = titlu_sectiune("Integrări")
          if randuri:
              sectiune_integrari += ('<table ' + TABEL + ' style="margin-top:4px;">'
                                     + randuri + '</table>')
          if fara:
              separator = ("padding-top:12px;margin-top:0;border-top:1px solid " + LINIE + ";"
                           if randuri else "padding-top:12px;")
              sectiune_integrari += (
                  '<p ' + txt(13, TEXT_3, extra=separator, clase="c-linie") + '>'
                  '<span class="c-t2" style="color:' + TEXT_2 + ';font-weight:600;">'
                  'Fără probleme (' + str(len(fara)) + ')</span>&nbsp; '
                  + PUNCT.join(link(i["link"], lipit(esc(i["nume"])), TEXT_3) for i in fara)
                  + '</p>'
              )

          # Secțiunea 3: detaliile, grupate pe integrare
          grupuri = ""
          for k, i in enumerate(g for g in cu_probleme if g["probleme"] or g["pr"]):
              contor = []
              if i["probleme"]:
                  contor.append(numar(len(i["probleme"]), "problemă", "probleme"))
              if i["pr"]:
                  contor.append(numar(len(i["pr"]), "PR", "PR-uri"))
              grupuri += (
                  '<div style="padding-top:' + ("24" if k else "12") + 'px;">'
                  '<table ' + TABEL + '><tr>'
                  '<td style="padding-bottom:8px;"><span ' + txt(14, TEXT, 600) + '>'
                  + link(i["link"], esc(i["nume"]), TEXT) + '</span>'
                  '<span ' + txt(13, TEXT_3) + '>&nbsp;&nbsp;' + " &middot; ".join(contor) + '</span></td>'
                  '<td align="right" style="padding-bottom:8px;"><span ' + txt(13, TEXT_3) + '>'
                  + link(i["link"] + "/issues", "GitHub&nbsp;&rarr;", TEXT_3) + '</span></td>'
                  '</tr></table>'
                  '<table ' + TABEL + '>'
                  + "".join(element(p) for p in i["probleme"] + i["pr"])
                  + '</table></div>'
              )

          sectiuni = [sectiune_hero, sectiune_integrari]
          if grupuri:
              sectiuni.append(titlu_sectiune("Probleme și PR-uri deschise" if total_pr
                                             else "Probleme deschise") + grupuri)

          corp = ""
          for k, s in enumerate(sectiuni):
              bordura = "border-top:1px solid " + LINIE + ";" if k else ""
              corp += ('<tr><td class="px c-linie" style="padding:32px;' + bordura + '">'
                       + s + '</td></tr>')

          subsol = "Trimis automat de GitHub Actions"
          if os.getenv("GITHUB_RUN_ID"):
              rulare = (os.getenv("GITHUB_SERVER_URL", "https://github.com") + "/"
                        + os.getenv("GITHUB_REPOSITORY", "") + "/actions/runs/"
                        + os.getenv("GITHUB_RUN_ID"))
              subsol += " &middot; " + link(rulare, "Vezi rularea", TEXT_3, "text-decoration:underline;")

          rezumat_text = " · ".join(t for _, t in piese)
          if total:
              titlu_hero = numar(total, "problemă deschisă", "probleme deschise")
          else:
              titlu_hero = "Nicio problemă găsită" if erori else "Nicio problemă deschisă"
          preheader = titlu_hero + ((" " if total else " · ") + rezumat_text if rezumat_text else "")

          CSS = (
              ":root{color-scheme:light dark;supported-color-schemes:light dark;}"
              "body{margin:0;padding:0;-webkit-text-size-adjust:100%;}"
              "a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;}"
              "@media only screen and (max-width:620px){"
              ".wrap{padding:16px!important;}"
              ".px{padding:24px 20px!important;}"
              "}"
              "@media (prefers-color-scheme:dark){"
              ".c-fundal{background:#0d1117!important;}"
              ".c-card{background:#161b22!important;border-color:#30363d!important;}"
              ".c-linie{border-color:#30363d!important;}"
              ".c-t1{color:#e6edf3!important;}"
              ".c-t2{color:#b1bac4!important;}"
              ".c-t3{color:#8b949e!important;}"
              ".c-acc{color:#f0883e!important;}"
              ".c-err{color:#ff7b72!important;}"
              ".c-plin{background:#db6d28!important;}"
              ".c-gol{background:#30363d!important;}"
              "}"
          )

          pagina = (
              '<!DOCTYPE html><html lang="ro"><head>'
              '<meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width,initial-scale=1">'
              '<meta name="color-scheme" content="light dark">'
              '<meta name="supported-color-schemes" content="light dark">'
              '<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">'
              '<title>Rezumat zilnic</title>'
              '<style>' + CSS + '</style>'
              '</head>'
              '<body class="c-fundal" style="margin:0;padding:0;background:' + FUNDAL + ';">'
              '<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;'
              'line-height:1px;color:transparent;">' + esc(preheader) + "&#847;&zwnj;&nbsp;" * 60 + '</div>'
              '<table ' + TABEL + ' class="c-fundal" bgcolor="' + FUNDAL + '" style="background:' + FUNDAL + ';">'
              '<tr><td align="center" class="wrap" style="padding:32px 16px;">'
              '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"'
              ' class="c-card" bgcolor="' + CARD + '" style="max-width:600px;background:' + CARD + ';'
              'border:1px solid ' + LINIE + ';border-radius:12px;border-collapse:separate;">'
              + corp +
              '</table>'
              '<table ' + TABEL + ' style="max-width:600px;"><tr>'
              '<td align="center" style="padding:16px 32px 0;"><p ' + txt(12, TEXT_3) + '>'
              + subsol + '</p></td></tr></table>'
              '</td></tr></table>'
              '</body></html>'
          )

          # ── Variantă text, pentru clienții care nu afișează HTML ────────────
          linii = ["Rezumat zilnic — " + azi + ", " + ora, "", preheader]
          for i in cu_probleme:
              if i["eroare"]:
                  linii += ["", i["nume"] + ": nu s-a putut citi (" + i["eroare"] + ")"]
                  continue
              linii += ["", i["nume"] + " — " + i["link"] + "/issues"]
              for p in i["probleme"] + i["pr"]:
                  linii.append("  " + ("[nou] " if p["nou"] else "") + ("[PR] " if p["este_pr"] else "")
                               + "#" + str(p["numar"]) + " " + p["titlu"]
                               + " — @" + p["autor"] + ", " + vechime(p["creat"]))
                  linii.append("  " + p["url"])
          if fara:
              linii += ["", "Fără probleme: " + ", ".join(i["nume"] for i in fara)]

          with open("rezumat.html", "w", encoding="utf-8") as f:
              f.write(pagina)
          with open("rezumat.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(linii) + "\n")

          # Subiect dinamic pentru email
          subiect = "Rezumat zilnic · " + titlu_hero[:1].lower() + titlu_hero[1:]
          if noi:
              subiect += " (" + numar(noi, "nouă", "noi") + ")"
          if erori:
              subiect += " · " + numar(erori, "integrare necitită", "integrări necitite")
          if os.getenv("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("subject=" + subiect + "\n")

          # Rezumat pe pagina rulării în GitHub Actions
          if os.getenv("GITHUB_STEP_SUMMARY"):
              md = ["### " + subiect, "", azi + ", " + ora + " · " + rezumat_text, "",
                    "| Integrare | Probleme | PR-uri |", "|---|---:|---:|"]
              for i in integrari:
                  if i["eroare"]:
                      md.append("| [" + i["nume"] + "](" + i["link"] + ") | eroare: "
                                + i["eroare"] + " | |")
                  else:
                      md.append("| [" + i["nume"] + "](" + i["link"] + ") | "
                                + str(len(i["probleme"])) + " | " + str(len(i["pr"])) + " |")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("\n".join(md) + "\n")

          print(subiect)
          PYTHONEOF

      - name: Trimite email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: ${{ steps.rezumat.outputs.subject }}
          to: ${{ secrets.EMAIL_TO }}
          from: "GitHub Workflows <${{ secrets.EMAIL_USER }}>"
          html_body: file://rezumat.html
          body: file://rezumat.txt
