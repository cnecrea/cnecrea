name: Rezumat zilnic probleme deschise

on:
  schedule:
    # Luni–vineri la 08:00 UTC (10:00 ora României iarna, 11:00 vara)
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  issues: read

jobs:
  rezumat-probleme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Doar biblioteca standard Python 3 de pe runner: fără checkout, setup-python sau pip
      - name: Generează rezumatul
        id: rezumat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYTHONEOF'
          import html
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          owner = "cnecrea"

          repos = {
              "cursbnr":         ("Curs BNR",         "https://github.com/cnecrea/cursbnr"),
              "e-bloc.ro":       ("E-bloc România",   "https://github.com/cnecrea/e-bloc.ro"),
              "eonromania":      ("E.ON România",     "https://github.com/cnecrea/eonromania"),
              "erovinieta":      ("CNAIR eRovinieta", "https://github.com/cnecrea/erovinieta"),
              "tollro":          ("CNAIR eToll",      "https://github.com/cnecrea/tollro"),
              "digi":            ("DIGI România",     "https://github.com/cnecrea/digi"),
              "hidroelectrica":  ("Hidroelectrica",   "https://github.com/cnecrea/hidroelectrica"),
              "fleet":           ("Manager de flotă", "https://github.com/cnecrea/fleet"),
              "myelectrica":     ("MyElectrica",      "https://github.com/cnecrea/myelectrica"),
              "myengie":         ("MyENGIE",          "https://github.com/cnecrea/myengie"),
              "vreaulanova":     ("Nova Power & Gas", "https://github.com/cnecrea/vreaulanova"),
              "opcom":           ("OPCOM",            "https://github.com/cnecrea/opcom"),
              "pagoplateste":    ("Pago Plătește",    "https://github.com/cnecrea/pagoplateste"),
              "reteleelectrice": ("Rețele Electrice", "https://github.com/cnecrea/reteleelectrice"),
              "smsto":           ("SMS.to",           "https://github.com/cnecrea/smsto"),
              "vehicule":        ("Vehicule",         "https://github.com/cnecrea/vehicule"),
          }
          MAX_RANDURI = 20  # câte probleme mai vechi apar pe larg; Gmail taie emailurile peste ~100 KB

          # ── Timp ────────────────────────────────────────────────────────────
          acum = datetime.now(timezone.utc)
          acum_ro = acum.astimezone(ZoneInfo("Europe/Bucharest"))
          # „Nou" = apărut de la raportul anterior; lunea acoperă și weekendul
          e_luni = acum_ro.weekday() == 0
          prag_nou = acum - timedelta(hours=72 if e_luni else 24)
          prag_inactiv = 30  # zile fără activitate

          luni = ["ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie",
                  "august", "septembrie", "octombrie", "noiembrie", "decembrie"]
          zile_sapt = ["luni", "marți", "miercuri", "joi", "vineri", "sâmbătă", "duminică"]
          azi = (zile_sapt[acum_ro.weekday()] + ", " + str(acum_ro.day) + " "
                 + luni[acum_ro.month - 1] + " " + str(acum_ro.year))
          ora = acum_ro.strftime("%H:%M")

          # ── Text în română ──────────────────────────────────────────────────
          def forma(n, unu, multe):
              """1 problemă · 2 probleme · 20 de probleme"""
              if n == 1:
                  return unu
              if n and (n % 100 == 0 or n % 100 >= 20):
                  return "de " + multe
              return multe

          def numar(n, unu, multe):
              return str(n) + " " + forma(n, unu, multe)

          def durata(moment):
              """„7 ore”, „ieri”, „12 zile”, „2 luni”, „un an”"""
              ore = int((acum - moment).total_seconds() // 3600)
              z = ore // 24
              if ore < 1:
                  return "câteva minute"
              if ore < 24:
                  return "o oră" if ore == 1 else numar(ore, "oră", "ore")
              if z < 2:
                  return "o zi"
              if z < 30:
                  return numar(z, "zi", "zile")
              if z < 365:
                  l = z // 30
                  return "o lună" if l == 1 else numar(l, "lună", "luni")
              a = z // 365
              return "un an" if a == 1 else numar(a, "an", "ani")

          def vechime(moment):
              d = durata(moment)
              return "ieri" if d == "o zi" else "acum " + d

          def cand(moment):
              """„azi, 14:03”, „ieri, 09:12” sau „05.11.2026”"""
              local = moment.astimezone(ZoneInfo("Europe/Bucharest"))
              if local.date() == acum_ro.date():
                  return "azi, " + local.strftime("%H:%M")
              if local.date() == acum_ro.date() - timedelta(days=1):
                  return "ieri, " + local.strftime("%H:%M")
              return zile_sapt[local.weekday()] + ", " + local.strftime("%H:%M") if (acum_ro.date() - local.date()).days < 7 \
                  else local.strftime("%d.%m.%Y")

          def data_gh(s):
              return datetime.fromisoformat(s.replace("Z", "+00:00"))

          # ── Preluare din GitHub ─────────────────────────────────────────────
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rezumat-zilnic",
          }
          token = os.getenv("GITHUB_TOKEN")
          if token:
              headers["Authorization"] = "Bearer " + token

          def cere(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as r:
                  return json.load(r)

          def preia(repo_key):
              toate = []
              for pagina in range(1, 11):
                  lot = cere("https://api.github.com/repos/" + owner + "/" + repo_key
                             + "/issues?state=open&per_page=100&page=" + str(pagina))
                  toate.extend(lot)
                  if len(lot) < 100:
                      break
              return toate

          def e_bot(user):
              return (user or {}).get("type") == "Bot" or (user or {}).get("login", "").endswith("[bot]")

          def asteapta_raspuns(repo_key, p):
              """Problemă deschisă de altcineva la care ultimul comentariu omenesc nu e al tău (sau nu există).
              Comentariile automate (rezumatul Copilot, închiderea automată) nu contează."""
              if p["este_pr"] or p["autor"].lower() == owner or p["autor_bot"]:
                  return False
              if not p["comentarii"]:
                  return True
              try:
                  coment = []
                  for pagina in range(1, 4):
                      lot = cere("https://api.github.com/repos/" + owner + "/" + repo_key + "/issues/"
                                 + str(p["numar"]) + "/comments?per_page=100&page=" + str(pagina))
                      coment.extend(lot)
                      if len(lot) < 100:
                          break
              except Exception as e:
                  print("Comentariile #" + str(p["numar"]) + " din " + repo_key + " nu s-au citit: " + type(e).__name__)
                  return False
              oameni = [c for c in coment if not e_bot(c.get("user"))]
              return not oameni or (oameni[-1].get("user") or {}).get("login", "").lower() != owner

          integrari = []
          for repo_key, (nume, link_repo) in repos.items():
              intrare = {"nume": nume, "link": link_repo, "probleme": [], "pr": [], "eroare": None}
              elemente = []
              try:
                  elemente = preia(repo_key)
              except urllib.error.HTTPError as e:
                  intrare["eroare"] = "HTTP " + str(e.code)
              except Exception as e:
                  intrare["eroare"] = type(e).__name__
              if intrare["eroare"]:
                  print("Eroare la " + repo_key + ": " + intrare["eroare"])
              for it in elemente:
                  este_pr = "pull_request" in it  # API-ul de issues întoarce și PR-urile
                  user = it.get("user") or {}
                  poza = user.get("avatar_url") or ""
                  p = {
                      "numar": it["number"],
                      "titlu": it["title"],
                      "url": it["html_url"],
                      "autor": user.get("login", "ghost"),
                      "autor_bot": e_bot(user),
                      "profil": user.get("html_url") or "https://github.com/" + user.get("login", "ghost"),
                      "poza": poza + ("&" if "?" in poza else "?") + "s=80" if poza else "",
                      "etichete": [(lb["name"], lb.get("color") or "8c959f") for lb in it.get("labels", [])],
                      "creat": data_gh(it["created_at"]),
                      "comentarii": it.get("comments", 0),
                      "inactiv": (acum - data_gh(it["updated_at"])).days,
                      "este_pr": este_pr,
                      "integrare": nume,
                      "link_integrare": link_repo,
                  }
                  p["nou"] = p["creat"] >= prag_nou
                  p["asteapta"] = asteapta_raspuns(repo_key, p)
                  intrare["pr" if este_pr else "probleme"].append(p)
              for lista in (intrare["probleme"], intrare["pr"]):
                  lista.sort(key=lambda p: p["creat"], reverse=True)
              integrari.append(intrare)

          citite = [i for i in integrari if not i["eroare"]]
          erori_lista = [i for i in integrari if i["eroare"]]
          probleme = [p for i in integrari for p in i["probleme"]]
          toate = [p for i in integrari for p in i["probleme"] + i["pr"]]
          total, total_pr, erori = len(probleme), sum(len(i["pr"]) for i in integrari), len(erori_lista)
          noi_lista = sorted((p for p in toate if p["nou"]), key=lambda p: p["creat"], reverse=True)
          noi = len(noi_lista)
          asteapta = sum(p["asteapta"] for p in toate)
          cu_probleme_n = sum(1 for i in integrari if i["probleme"])
          cea_veche = min((p["creat"] for p in probleme), default=None)

          # Cele cu ceva de văzut primele, cele mai încărcate sus; restul pe un rând
          cu_probleme = sorted(
              (i for i in integrari if i["probleme"] or i["pr"] or i["eroare"]),
              key=lambda i: (bool(i["eroare"]), -len(i["probleme"]), -len(i["pr"]), i["nume"]))
          fara = [i for i in integrari if not (i["probleme"] or i["pr"] or i["eroare"])]

          # Lista de jos: ce nu e nou, pe integrări (cele noi sunt deja sus, o singură dată)
          vechi_grupuri, afisate = [], 0
          for i in cu_probleme:
              lista = [p for p in i["probleme"] + i["pr"] if not p["nou"]]
              if lista:
                  loc = max(0, MAX_RANDURI - afisate)
                  vechi_grupuri.append({**i, "lista": lista[:loc], "ascunse": len(lista) - len(lista[:loc]), "toate": len(lista)})
                  afisate += len(lista[:loc])
          ascunse = sum(g["ascunse"] for g in vechi_grupuri)

          # ── Subiectul și previzualizarea din inbox: spun vestea ─────────────
          interval = "de vineri încoace" if e_luni else "în ultimele 24 de ore"
          def scurt(t, n=60):
              return t if len(t) <= n else t[:n - 1].rstrip() + "…"

          if noi == 1:
              p0 = noi_lista[0]
              subiect = ("PR nou" if p0["este_pr"] else "Problemă nouă") + " la " + p0["integrare"] + ": " + scurt(p0["titlu"])
          elif noi:
              unde = list(dict.fromkeys(p["integrare"] for p in noi_lista))
              subiect = numar(noi, "nouă", "noi") + " (" + ", ".join(unde[:2]) + (" și încă " + str(len(unde) - 2) if len(unde) > 2 else "") + ")"
          else:
              subiect = "Rezumat zilnic"
          if total:
              subiect += " · " + numar(total, "problemă deschisă", "probleme deschise")
          elif not erori:
              subiect += " · nicio problemă deschisă"
          if asteapta and not noi:
              subiect += " · " + numar(asteapta, "așteaptă", "așteaptă") + " răspuns"
          if erori:
              subiect += " · " + numar(erori, "integrare necitită", "integrări necitite")

          if noi:
              p0 = noi_lista[0]
              preheader = (p0["autor"] + " a deschis " + ("un PR" if p0["este_pr"] else "o problemă") + " la " + p0["integrare"]
                           + " " + cand(p0["creat"]) + ": " + p0["titlu"]
                           + (". Și încă " + numar(noi - 1, "nouă", "noi") + "." if noi > 1 else "."))
          elif total:
              preheader = (numar(asteapta, "problemă așteaptă", "probleme așteaptă") + " răspunsul tău. " if asteapta else "") \
                  + "Nimic nou " + interval + "."
          else:
              preheader = "Nicio problemă deschisă în cele " + numar(len(repos), "integrare", "integrări") + "."
          if erori:
              preheader = (erori_lista[0]["nume"] + " nu a putut fi citită (" + erori_lista[0]["eroare"] + "). " if erori == 1
                           else numar(erori, "integrare", "integrări") + " nu au putut fi citite. ") + preheader

          rulare = ""
          if os.getenv("GITHUB_RUN_ID"):
              rulare = (os.getenv("GITHUB_SERVER_URL", "https://github.com") + "/" + os.getenv("GITHUB_REPOSITORY", "")
                        + "/actions/runs/" + os.getenv("GITHUB_RUN_ID"))

          # ── Design: tokenii emailurilor hubinteligent (core/contrib_mail.py), ca raportul de fork-uri ──
          # Cifra zilei în Plex Mono, vechimea problemelor lângă ea, vestea pe albastru, „așteaptă răspuns" în chihlimbar,
          # roșu doar pentru o integrare necitită. Tabele cu stiluri inline; dark mode și telefon prin clase.
          SANS = "'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
          MONO = "'IBM Plex Mono',Menlo,Consolas,monospace"
          FONTS_URL = ("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500"
                       "&family=IBM+Plex+Sans:wght@400;500;600&display=swap")
          CANVAS, SURFACE, SURFACE_UP = "#fafafa", "#ffffff", "#f7f7f8"
          LINE = "#dfdfe2"
          INK, INK_SOFT, INK_MUTED, INK_FAINT = "#17171c", "#3e3e46", "#67676f", "#909098"
          SIGNAL, EROARE, ATENTIE, MONOGRAMA = "#0e65f1", "#c42b1c", "#b25e09", "#f0f0f2"
          SPALAT, SPALAT_LINIE = "#f2f7ff", "#cfe0fc"
          BARA, PISTA = "#c4c4cb", "#f0f0f2"
          CLASA = {INK: "c-ink", INK_SOFT: "c-soft", INK_MUTED: "c-muted", INK_FAINT: "c-faint",
                   SIGNAL: "c-sig", EROARE: "c-err", ATENTIE: "c-warn-t"}
          INALTIME = {10: 14, 11: 16, 12: 18, 13: 20, 14: 22, 15: 22, 18: 26}
          TABEL = 'role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"'
          TABEL_MIC = 'role="presentation" cellpadding="0" cellspacing="0" border="0"'
          LOGO_URL = "https://hubinteligent.org/brand/hubinteligent-logo-128.png"
          CSS = (
              ":root{color-scheme:light dark;supported-color-schemes:light dark;}"
              "body{margin:0;padding:0;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;}"
              "a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;}"
              ".hc{border-radius:3px;font-size:0;line-height:0;}"
              "@media only screen and (max-width:600px){.wrap{padding:12px!important;}.px{padding:20px 16px!important;}"
              ".pxh{padding:14px 16px!important;}.st{display:block!important;width:100%!important;}"
              ".hm{padding:20px 0 0!important;text-align:left!important;}.cal{float:none!important;margin:0!important;}"
              ".bt{padding:8px 0 0!important;text-align:left!important;}.lk{text-align:left!important;padding:2px 0 0!important;}"
              ".nm{width:42%!important;}.cif{font-size:40px!important;line-height:42px!important;}}"
              "@media (prefers-color-scheme:dark){"
              ".c-canvas{background:#111113!important;}"
              ".c-surface{background:#1a1a1c!important;border-color:#28282a!important;}"
              ".c-up{background:#202022!important;}.c-line{border-color:#28282a!important;}"
              ".c-ink{color:#f4f4f5!important;}.c-soft{color:#cfcfd3!important;}"
              ".c-muted{color:#a0a0a7!important;}.c-faint{color:#71717a!important;}"
              ".c-sig{color:#488af4!important;}.c-sigb{border-color:#488af4!important;}.c-err{color:#f47067!important;}"
              ".c-warn-t{color:#e0a458!important;}"
              ".c-warn{border-color:#28282a!important;border-left-color:#f47067!important;}"
              ".c-wash{background:#162238!important;border-color:#27406e!important;}.c-washl{border-color:#27406e!important;}"
              ".c-btn{background:#1a1a1c!important;border-color:#3a3a3f!important;color:#f4f4f5!important;}"
              ".c-mg{background:#26262a!important;color:#cfcfd3!important;}"
              ".c-bar{background:#55555d!important;}.c-barn{background:#488af4!important;}.c-track{background:#242427!important;}"
              "}"
          )
          MSO = ("<!--[if mso]><style>body,table,td,p,a,span,h1,h2{font-family:'Segoe UI',Arial,sans-serif!important;}"
                 ".m{font-family:Consolas,'Courier New',monospace!important;}</style><![endif]-->")

          def esc(v):
              return html.escape(str(v), quote=True)

          def nb(v):
              """Nume compuse care nu se rup pe două rânduri („Nova Power & Gas”, „HTTP 403”)."""
              return esc(v).replace(" ", "&nbsp;").replace("-", "&#8209;")

          def txt(size, color, weight=400, extra="", mono=False, cls=""):
              """Textul moștenește fontul de pe card (SANS); doar cifrele își pun Plex Mono."""
              c = " ".join(x for x in (CLASA.get(color, ""), "m" if mono else "", cls) if x)
              font = f"font-family:{MONO};font-variant-numeric:tabular-nums;" if mono else ""
              greutate = f"font-weight:{weight};" if weight != 400 else ""
              return (f'class="{c}" style="margin:0;{font}font-size:{size}px;line-height:{INALTIME[size]}px;'
                      f'color:{color};{greutate}{extra}"')

          def p_(continut, size, color, weight=400, extra="", mono=False, cls="", tag="p"):
              return f"<{tag} {txt(size, color, weight, extra, mono, cls)}>{continut}</{tag}>"

          def link(url, eticheta, color, weight=500, extra=""):
              greutate = f"font-weight:{weight};" if weight != 400 else ""
              return (f'<a href="{esc(url)}" class="{CLASA.get(color, "")}" '
                      f'style="color:{color};text-decoration:none;{greutate}{extra}">{eticheta}</a>')

          def mono(v, extra=""):
              return f'<span class="m" style="font-family:{MONO};{extra}">{v}</span>'

          def culoare(t, c):
              return f'<span class="{CLASA[c]}" style="color:{c};">{t}</span>'

          SEP = f'<span class="c-faint" style="color:{INK_FAINT}">&nbsp;&nbsp;·&nbsp;</span> '

          def poza(p, marime):
              """Poza autorului de pe GitHub. Dacă pozele sunt blocate, inițiala (textul alternativ) stă pe fundalul ei gri."""
              raza, litera = marime // 2, esc((p["autor"][:1] or "?").upper())
              lit = 11 if marime < 32 else 15
              stil = (f"width:{marime}px;height:{marime}px;border-radius:{raza}px;background:{MONOGRAMA};color:{INK_SOFT};"
                      f"font-size:{lit}px;line-height:{marime}px;font-weight:600;text-align:center;")
              if p["poza"]:
                  return (f'<img class="c-mg" src="{esc(p["poza"])}" width="{marime}" height="{marime}" alt="{litera}" '
                          f'style="display:block;border:0;{stil}">')
              return f'<div class="c-mg" style="{stil}">{litera}</div>'

          def _lum(c):
              def canal(v):
                  v /= 255
                  return v / 12.92 if v <= 0.03928 else ((v + 0.055) / 1.055) ** 2.4
              return 0.2126 * canal(c[0]) + 0.7152 * canal(c[1]) + 0.0722 * canal(c[2])

          def punct_eticheta(hexa):
              """Culoarea etichetei GitHub, întunecată până are contrast 3:1 cu albul (galbenul și bleu-ul se pierdeau)."""
              h = hexa.lstrip("#")
              c = tuple(int(h[k:k + 2], 16) for k in (0, 2, 4)) if len(h) == 6 else (140, 149, 159)
              while (1.05) / (_lum(c) + 0.05) < 3:
                  c = tuple(round(x * 0.88) for x in c)
              return "#%02x%02x%02x" % c

          def etichete(p):
              """Etichetele GitHub ca punct colorat + nume: păstrează culoarea lor fără casete care se bat cap în cap cu tema."""
              return "".join(
                  f'<span class="c-muted" style="display:inline-block;margin-right:10px;font-size:12px;line-height:18px;'
                  f'color:{INK_MUTED};white-space:nowrap"><span style="color:{punct_eticheta(c)};font-size:10px;'
                  f'vertical-align:1px">●</span>&nbsp;{esc(n)}</span>' for n, c in p["etichete"])

          ETICHETA_PR = (f'<span class="c-soft m" style="display:inline-block;margin-right:6px;padding:0 5px;border:1px solid {LINE};'
                         f'border-radius:4px;font-family:{MONO};font-size:11px;line-height:16px;font-weight:500;color:{INK_SOFT};'
                         f'vertical-align:1px;">PR</span>')

          def meta(p, cu_integrare=False):
              bucati = []
              if cu_integrare:
                  bucati.append(link(p["link_integrare"] + "/issues", nb(p["integrare"]), INK_SOFT, 500))
              bucati.append(mono("#" + str(p["numar"])))
              bucati.append(link(p["profil"], "@" + esc(p["autor"]), INK_MUTED, 400))
              bucati.append(mono(nb(cand(p["creat"]))) if p["nou"] else nb(vechime(p["creat"])))
              if p["comentarii"]:
                  bucati.append(nb(numar(p["comentarii"], "comentariu", "comentarii")))
              if p["asteapta"]:
                  bucati.append(culoare(nb("așteaptă răspuns"), ATENTIE))
              if p["inactiv"] >= prag_inactiv:
                  bucati.append(culoare(nb("fără activitate de " + numar(p["inactiv"], "zi", "zile")), ATENTIE))
              return SEP.join(bucati)

          # Antetul, ca în emailurile site-ului: marca și numele în stânga, eticheta emailului în dreapta
          antet = (f'<tr><td class="pxh c-line" style="padding:16px 24px;border-bottom:1px solid {LINE};">'
                   f'<table {TABEL}><tr><td valign="middle" style="width:24px;">'
                   f'<img src="{LOGO_URL}" width="24" height="24" alt="" style="display:block;width:24px;height:24px;border:0;'
                   f'border-radius:7px;"></td>'
                   f'<td valign="middle" style="padding-left:10px;"><span class="c-ink" style="font-family:{SANS};'
                   f'font-size:14px;line-height:20px;font-weight:600;color:{INK};letter-spacing:-0.01em;">hubinteligent</span></td>'
                   f'<td align="right" valign="middle">{p_("Probleme GitHub", 12, INK_MUTED, 500, tag="span")}</td>'
                   f'</tr></table></td></tr>')

          # ── 1. Contorul zilei și vechimea problemelor ──
          def vechimi():
              """Patru coloane: câte probleme deschise așteaptă de o săptămână, o lună, trei luni, mai mult.
              Cele noi apar în albastru, în prima coloană."""
              praguri = [(7, "sub 1 săpt."), (30, "1–4 săpt."), (90, "1–3 luni"), (None, "peste 3 luni")]
              grupe = [[0, 0] for _ in praguri]  # [noi, vechi]
              for p in probleme:
                  z = (acum - p["creat"]).days
                  k = next(k for k, (lim, _) in enumerate(praguri) if lim is None or z < lim)
                  grupe[k][0 if p["nou"] else 1] += 1
              maxim = max([a + b for a, b in grupe] + [1])
              INALT = 44
              mic = f"font-family:{SANS};font-size:10px;line-height:12px;color:{INK_FAINT};"
              cifre, coloane, etichete_c = "", "", ""
              for k, ((n_nou, n_vechi), (_, eticheta)) in enumerate(zip(grupe, praguri)):
                  n = n_nou + n_vechi
                  h_nou = round(INALT * n_nou / maxim) if n_nou else 0
                  h_vechi = round(INALT * n_vechi / maxim) if n_vechi else 0
                  if n and h_nou + h_vechi < 3:
                      h_vechi = 3 - h_nou if n_vechi else 0
                      h_nou = h_nou or (3 if not n_vechi else 0)
                  bloc = ""
                  if h_nou:
                      bloc += (f'<tr><td class="c-barn" height="{h_nou}" bgcolor="{SIGNAL}" style="height:{h_nou}px;'
                               f'border-radius:3px 3px {0 if h_vechi else 3}px {0 if h_vechi else 3}px;font-size:0;line-height:0;">&nbsp;</td></tr>')
                  if h_vechi:
                      bloc += (f'<tr><td class="c-bar" height="{h_vechi}" bgcolor="{BARA}" style="height:{h_vechi}px;'
                               f'border-radius:{0 if h_nou else 3}px {0 if h_nou else 3}px 3px 3px;font-size:0;line-height:0;">&nbsp;</td></tr>')
                  if not n:
                      bloc = (f'<tr><td class="c-track" height="2" bgcolor="{PISTA}" style="height:2px;border-radius:1px;'
                              f'font-size:0;line-height:0;">&nbsp;</td></tr>')
                  pad = "padding-left:6px;" if k else ""
                  cifre += (f'<td align="center" valign="bottom" style="{pad}">'
                            + p_(str(n), 12, INK if n else INK_FAINT, 500, mono=True) + '</td>')
                  coloane += (f'<td width="52" valign="bottom" style="width:52px;height:{INALT}px;{pad}">'
                              f'<table {TABEL}>{bloc}</table></td>')
                  etichete_c += (f'<td class="c-faint" align="center" valign="top" style="{mic}{pad}padding-top:5px;'
                                 f'white-space:nowrap;">{eticheta}</td>')
              return (f'<table {TABEL_MIC} class="cal" align="right" style="margin:0 0 0 auto;">'
                      f'<tr><td colspan="4" class="c-faint" style="{mic}padding-bottom:6px;">Vechimea problemelor</td></tr>'
                      f'<tr>{cifre}</tr><tr>{coloane}</tr><tr>{etichete_c}</tr></table>')

          culoare_cifra = INK if total else INK_FAINT
          if total:
              sub_cifra = "în " + str(cu_probleme_n) + " din " + numar(len(repos), "integrare", "integrări")
          else:
              sub_cifra = ("în cele " + numar(len(repos) - erori, "integrare citită", "integrări citite") if erori
                           else "în toate cele " + numar(len(repos), "integrare", "integrări"))
          cifra = (f'<h1 style="margin:0;font-weight:400;">'
                   f'<span class="{CLASA[culoare_cifra]} m cif" style="display:block;font-family:{MONO};font-variant-numeric:tabular-nums;'
                   f'font-size:48px;line-height:50px;font-weight:500;color:{culoare_cifra};letter-spacing:-0.04em;">{total}</span>'
                   f'<span class="c-ink" style="display:block;padding-top:6px;font-family:{SANS};font-size:15px;line-height:22px;'
                   f'font-weight:600;color:{INK};letter-spacing:-0.01em;">{esc(forma(total, "problemă deschisă", "probleme deschise"))}'
                   f'</span></h1>' + p_(esc(sub_cifra), 13, INK_MUTED))
          s1 = p_(esc(azi[:1].upper() + azi[1:]) + SEP + mono(ora), 12, INK_MUTED)
          s1 += (f'<table {TABEL} style="margin-top:8px;"><tr>'
                 f'<td class="st" valign="bottom">{cifra}</td>'
                 + (f'<td class="st hm" valign="bottom" align="right" style="padding-left:16px;">{vechimi()}</td>' if total else "")
                 + '</tr></table>')

          # Vestea: ce a apărut de la ultimul raport, fiecare o singură dată
          if noi_lista:
              randuri = (f'<tr><td class="c-washl" style="padding:12px 16px 0;">'
                         + p_(esc(("Noi " + interval) if not e_luni else "Noi de vineri încoace"), 12, SIGNAL, 600) + '</td></tr>')
              for k, p in enumerate(noi_lista):
                  bord = f"border-top:1px solid {SPALAT_LINIE};" if k else ""
                  titlu = (ETICHETA_PR if p["este_pr"] else "") + link(p["url"], esc(p["titlu"]), INK, 600)
                  buton = (f'<a href="{esc(p["url"])}" class="c-btn" style="display:inline-block;padding:5px 11px;border:1px solid {LINE};'
                           f'border-radius:8px;background:{SURFACE};font-family:{SANS};font-size:12px;line-height:18px;font-weight:500;'
                           f'color:{INK};text-decoration:none;white-space:nowrap;">{"Vezi PR-ul" if p["este_pr"] else "Răspunde"}</a>')
                  et = etichete(p)
                  randuri += (f'<tr><td class="c-washl" style="padding:{12 if k else 10}px 16px 14px;{bord}"><table {TABEL}><tr>'
                              f'<td width="40" valign="top" style="width:40px;">{poza(p, 40)}</td>'
                              f'<td valign="top" style="padding-left:12px;"><table {TABEL}><tr>'
                              f'<td class="st" valign="middle">{p_(titlu, 14, INK)}'
                              f'{p_(meta(p, True), 12, INK_MUTED, extra="padding-top:2px;")}'
                              + (f'<div style="padding-top:2px;">{et}</div>' if et else "")
                              + f'</td><td class="st bt" valign="middle" align="right" style="padding-left:12px;">{buton}</td>'
                              f'</tr></table></td></tr></table></td></tr>')
              s1 += (f'<table {TABEL} class="c-wash" bgcolor="{SPALAT}" style="margin-top:20px;background:{SPALAT};'
                     f'border:1px solid {SPALAT_LINIE};border-radius:12px;border-collapse:separate;">{randuri}</table>')
          if erori_lista:
              if erori == 1:
                  r = erori_lista[0]
                  mesaj = (f'<b class="c-ink" style="color:{INK};font-weight:600;">{nb(r["nume"])}</b> '
                           f'nu a putut fi citită ({mono(nb(r["eroare"]))}), așa că cifrele de mai jos nu includ problemele ei.')
              else:
                  mesaj = ("Nu au putut fi citite: " + ", ".join(
                      f'<b class="c-ink" style="color:{INK};font-weight:600;">{nb(r["nume"])}</b> ({mono(nb(r["eroare"]))})'
                      for r in erori_lista) + ". Cifrele de mai jos nu includ problemele lor.")
              s1 += (f'<table {TABEL} class="c-warn" style="margin-top:12px;border:1px solid {LINE};border-left:3px solid {EROARE};'
                     f'border-radius:10px;border-collapse:separate;"><tr><td style="padding:10px 14px;">'
                     f'{p_(mesaj, 13, INK_SOFT)}</td></tr></table>')

          # Citirile: fără casete, pe un rând, sub o linie
          def citire(eticheta, valoare, culoare_v=INK, cuvant=False):
              stil = (f"font-family:{SANS};font-size:15px;" if cuvant else
                      f"font-family:{MONO};font-variant-numeric:tabular-nums;font-size:18px;letter-spacing:-0.02em;")
              v = (f'<span class="{CLASA[culoare_v]}{"" if cuvant else " m"}" style="{stil}font-weight:500;color:{culoare_v};">'
                   f'{esc(valoare)}</span>')
              return (f'<td width="33%" valign="top">{p_(esc(eticheta), 12, INK_MUTED)}'
                      f'<p style="margin:0;padding-top:1px;line-height:26px;white-space:nowrap;">{v}</p></td>')

          if total or total_pr:
              s1 += (f'<table {TABEL} class="c-line" style="margin-top:20px;border-top:1px solid {LINE};"><tr><td style="padding-top:14px;">'
                     f'<table {TABEL}><tr>'
                     + citire("Așteaptă răspuns", asteapta, ATENTIE if asteapta else INK_FAINT)
                     + citire("PR-uri deschise", total_pr, INK if total_pr else INK_FAINT)
                     + citire("Cea mai veche", durata(cea_veche) if cea_veche else "—", cuvant=True)
                     + '</tr></table></td></tr></table>')

          # ── 2. Pe integrări: bara arată câte are fiecare, capătul albastru ce e nou ──
          s2 = p_("Pe integrări", 14, INK, 600, tag="h2")
          maxim = max([len(i["probleme"]) for i in citite] + [1])
          randuri = ""
          for k, i in enumerate(cu_probleme):
              bord = f"border-top:1px solid {LINE};" if k else ""
              eticheta_pr = ("" if not i["pr"] else
                             f'<span class="c-muted" style="font-size:12px;font-weight:400;color:{INK_MUTED};">&nbsp;&nbsp;'
                             + mono(len(i["pr"])) + "&nbsp;PR" + ("-uri" if len(i["pr"]) > 1 else "") + "</span>")
              nume = (f'<td class="c-line nm" width="40%" valign="middle" style="padding:9px 0;{bord}">'
                      f'{p_(link(i["link"] + "/issues", nb(i["nume"]), INK_SOFT, 500) + eticheta_pr, 14, INK_SOFT)}</td>')
              if i["eroare"]:
                  randuri += (f'<tr>{nume}<td class="c-line" colspan="2" valign="middle" align="right" style="padding:9px 0 9px 12px;{bord}">'
                              f'{p_("nu s-a putut citi" + SEP + mono(nb(i["eroare"])), 12, EROARE)}</td></tr>')
                  continue
              n = len(i["probleme"])
              plus = sum(p["nou"] for p in i["probleme"])
              vechi_w, nou_w = round(100 * (n - plus) / maxim), round(100 * plus / maxim)
              segmente = ""
              if vechi_w:
                  segmente += f'<td class="hc c-bar" width="{vechi_w}%" height="6" bgcolor="{BARA}" style="height:6px;"></td>'
              if nou_w:
                  segmente += f'<td class="hc c-barn" width="{nou_w}%" height="6" bgcolor="{SIGNAL}" style="height:6px;"></td>'
              if vechi_w + nou_w < 100:
                  segmente += '<td height="6" style="height:6px;font-size:0;line-height:0;"></td>'
              bara = (f'<table {TABEL} class="hc c-track" bgcolor="{PISTA}" style="background:{PISTA};border-radius:3px;">'
                      f'<tr>{segmente}</tr></table>')
              semn = (f'<span class="c-sig" style="font-size:12px;color:{SIGNAL};">+{plus}</span>&nbsp;&nbsp;' if plus else "")
              randuri += (f'<tr>{nume}<td class="c-line" valign="middle" style="padding:9px 0 9px 12px;{bord}">{bara}</td>'
                          f'<td class="c-line" width="56" valign="middle" align="right" style="width:56px;padding:9px 0 9px 8px;{bord}'
                          f'white-space:nowrap;">{p_(semn + str(n), 13, INK if n else INK_FAINT, 500, mono=True)}</td></tr>')
          if randuri:
              s2 += f'<table {TABEL} style="margin-top:6px;">{randuri}</table>'
          if fara:
              sus = f"margin-top:4px;padding-top:12px;border-top:1px solid {LINE};" if randuri else "padding-top:8px;"
              s2 += p_(f'<span class="c-soft" style="color:{INK_SOFT};font-weight:500;">Fără probleme</span>&nbsp;'
                       + mono(len(fara)) + "&nbsp;&nbsp;" + SEP.join(link(i["link"], nb(i["nume"]), INK_MUTED, 400) for i in fara),
                       13, INK_MUTED, extra=sus, cls="c-line")

          # ── 3. Restul problemelor deschise, pe integrări ──
          s3 = ""
          if vechi_grupuri:
              s3 = p_("Deschise de mai demult" if noi else ("Probleme și PR-uri deschise" if total_pr else "Probleme deschise"),
                      14, INK, 600, tag="h2")
              s3 += p_("Titlul deschide problema, numele deschide profilul autorului.", 13, INK_MUTED, extra="padding-top:2px;")
              for g in vechi_grupuri:
                  if not g["lista"]:
                      continue
                  contor = []
                  n_prob = sum(1 for p in g["probleme"] if not p["nou"])
                  n_pr = sum(1 for p in g["pr"] if not p["nou"])
                  if n_prob:
                      contor.append(numar(n_prob, "problemă", "probleme"))
                  if n_pr:
                      contor.append(numar(n_pr, "PR", "PR-uri"))
                  rows = ""
                  for p in g["lista"]:
                      titlu = (ETICHETA_PR if p["este_pr"] else "") + link(p["url"], esc(p["titlu"]), INK, 500)
                      et = etichete(p)
                      rows += (f'<tr><td class="c-line" width="24" valign="top" style="padding:12px 0 10px;border-top:1px solid {LINE}">'
                               f'{poza(p, 24)}</td><td class="c-line" valign="top" style="padding:10px 0 10px 10px;'
                               f'border-top:1px solid {LINE}">{p_(titlu, 14, INK)}{p_(meta(p), 12, INK_MUTED, extra="padding-top:2px")}'
                               + (f'<div style="padding-top:1px">{et}</div>' if et else "") + '</td></tr>')
                  if g["ascunse"]:
                      rows += (f'<tr><td></td><td class="c-line" style="padding:10px 0 0 10px;border-top:1px solid {LINE};">'
                               + p_("Și încă " + esc(numar(g["ascunse"], "problemă", "probleme")) + SEP
                                    + link(g["link"] + "/issues", "vezi pe GitHub&nbsp;→", INK_SOFT, 500), 13, INK_MUTED) + '</td></tr>')
                  s3 += (f'<table {TABEL} style="margin-top:18px;"><tr>'
                         f'<td valign="bottom" style="padding-bottom:8px;">{p_(link(g["link"] + "/issues", nb(g["nume"]), INK, 600), 14, INK)}</td>'
                         f'<td valign="bottom" align="right" style="padding:0 0 8px 12px;white-space:nowrap;">'
                         f'{p_(esc(" · ".join(contor)), 12, INK_MUTED)}</td></tr></table>'
                         f'<table {TABEL}>{rows}</table>')
              restul_grupuri = [g for g in vechi_grupuri if not g["lista"]]
              if restul_grupuri:
                  s3 += (f'<table {TABEL} style="margin-top:18px;"><tr><td class="c-line" style="padding-top:12px;border-top:1px solid {LINE};">'
                         + p_("Și încă " + esc(numar(sum(g["toate"] for g in restul_grupuri), "problemă", "probleme")) + " la "
                              + ", ".join(link(g["link"] + "/issues", nb(g["nume"]), INK_SOFT, 500) for g in restul_grupuri)
                              + ". Emailul arată primele " + mono(MAX_RANDURI) + ", ca să nu fie tăiat de Gmail.", 13, INK_MUTED)
                         + '</td></tr></table>')

          corp = antet + "".join(
              f'<tr><td class="px c-line" style="padding:24px;{"border-top:1px solid " + LINE + ";" if k else ""}">{s}</td></tr>'
              for k, s in enumerate(x for x in (s1, s2, s3) if x))
          subsol = "Trimis automat de GitHub&nbsp;Actions" + (SEP + link(rulare, "Vezi rularea", INK_SOFT, 500) if rulare else "")
          corp += (f'<tr><td class="px c-up c-line" align="center" bgcolor="{SURFACE_UP}" style="padding:14px 24px;'
                   f'background:{SURFACE_UP};border-top:1px solid {LINE};border-radius:0 0 13px 13px;">'
                   f'{p_(subsol, 12, INK_MUTED)}</td></tr>')
          pagina = (
              '<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width,initial-scale=1">'
              '<meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark">'
              '<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">'
              f'<title>{esc(subiect)}</title><link rel="stylesheet" href="{FONTS_URL}"><style>{CSS}</style>{MSO}</head>'
              f'<body class="c-canvas" style="margin:0;padding:0;background:{CANVAS};font-family:{SANS};">'
              '<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:transparent;">'
              + esc(preheader) + "&#847;&zwnj;&nbsp;" * 60 + '</div>'
              f'<table {TABEL} class="c-canvas" bgcolor="{CANVAS}" style="background:{CANVAS};">'
              '<tr><td align="center" class="wrap" style="padding:32px 16px;">'
              f'<table {TABEL} class="c-surface" bgcolor="{SURFACE}" style="max-width:560px;background:{SURFACE};font-family:{SANS};'
              f'border:1px solid {LINE};border-radius:14px;border-collapse:separate;">' + corp + '</table>'
              '</td></tr></table></body></html>'
          )

          # ── Variantă text, pentru clienții care nu afișează HTML ────────────
          def linie_text(p):
              extra = []
              if p["asteapta"]:
                  extra.append("așteaptă răspuns")
              if p["inactiv"] >= prag_inactiv:
                  extra.append("fără activitate de " + numar(p["inactiv"], "zi", "zile"))
              return ("  " + ("[PR] " if p["este_pr"] else "") + "#" + str(p["numar"]) + " " + p["titlu"]
                      + " — @" + p["autor"] + ", " + (cand(p["creat"]) if p["nou"] else vechime(p["creat"]))
                      + ("; " + ", ".join(extra) if extra else ""))

          linii = ["hubinteligent · Probleme GitHub", "Rezumat zilnic · " + azi + ", " + ora, "",
                   numar(total, "problemă deschisă", "probleme deschise") + (" (" + sub_cifra + ")" if total else "")]
          if noi_lista:
              linii += ["", ("NOI DE VINERI ÎNCOACE" if e_luni else "NOI ÎN ULTIMELE 24 DE ORE")]
              for p in noi_lista:
                  linii += [linie_text(p).replace("  ", "  " + p["integrare"] + ": ", 1), "  " + p["url"]]
          for r in erori_lista:
              linii.append(r["nume"] + " nu a putut fi citită (" + r["eroare"] + "); cifrele nu includ problemele ei.")
          if total or total_pr:
              linii += ["", "Așteaptă răspuns: " + str(asteapta) + " · PR-uri deschise: " + str(total_pr)
                        + " · Cea mai veche: " + (durata(cea_veche) if cea_veche else "—")]
          for g in vechi_grupuri:
              if g["lista"]:
                  linii += ["", g["nume"].upper() + " — " + g["link"] + "/issues"]
                  for p in g["lista"]:
                      linii += [linie_text(p), "  " + p["url"]]
                  if g["ascunse"]:
                      linii.append("  și încă " + numar(g["ascunse"], "problemă", "probleme") + " pe GitHub")
          restul_text = [g for g in vechi_grupuri if not g["lista"]]
          if restul_text:
              linii += ["", "Și încă " + numar(sum(g["toate"] for g in restul_text), "problemă", "probleme") + " la "
                        + ", ".join(g["nume"] for g in restul_text) + "."]
          if fara:
              linii += ["", "Fără probleme: " + ", ".join(i["nume"] for i in fara)]
          linii += ["", "—", "Trimis automat de GitHub Actions" + (": " + rulare if rulare else "")]

          with open("rezumat.html", "w", encoding="utf-8") as f:
              f.write(pagina)
          with open("rezumat.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(linii) + "\n")

          if os.getenv("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("subject=" + subiect + "\n")

          # Rezumat pe pagina rulării în GitHub Actions
          if os.getenv("GITHUB_STEP_SUMMARY"):
              md = ["### " + subiect, "", azi + ", " + ora, "",
                    "| Integrare | Probleme | Noi | PR-uri | Așteaptă răspuns |", "|---|---:|---:|---:|---:|"]
              for i in integrari:
                  if i["eroare"]:
                      md.append("| [" + i["nume"] + "](" + i["link"] + ") | eroare: " + i["eroare"] + " | | | |")
                  else:
                      md.append("| [" + i["nume"] + "](" + i["link"] + "/issues) | " + str(len(i["probleme"])) + " | "
                                + str(sum(p["nou"] for p in i["probleme"] + i["pr"]) or "") + " | " + str(len(i["pr"]) or "") + " | "
                                + str(sum(p["asteapta"] for p in i["probleme"]) or "") + " |")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("\n".join(md) + "\n")

          print(subiect)
          PYTHONEOF

      # Semnat DKIM (selectorul github2026, cheia în secretul DKIM_GITHUB_KEY), ca DMARC să treacă:
      # Gmail pune contul lui ca expeditor tehnic, deci SPF nu se aliniază niciodată cu hubinteligent.org.
      # Fără secret sau fără dkimpy, emailul pleacă nesemnat, cu un avertisment pe pagina rulării.
      - name: Trimite email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DKIM_KEY: ${{ secrets.DKIM_GITHUB_KEY }}
          SUBIECT: ${{ steps.rezumat.outputs.subject }}
        run: |
          # dkimpy din arhiva Ubuntu (pachet semnat, aceeași bibliotecă ca la cronul serverului)
          if [ -n "$DKIM_KEY" ]; then
            { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-dkim; } >/dev/null \
              || echo "::warning::Nu am putut instala python3-dkim"
          fi
          /usr/bin/python3 << 'PYTHONEOF'
          import os
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.utils import formatdate, getaddresses, make_msgid

          DOMENIU = "hubinteligent.org"
          SELECTOR = "github2026"
          EXPEDITOR = "github@" + DOMENIU
          ANTETE_SEMNATE = [b"from", b"to", b"subject", b"date", b"message-id", b"mime-version", b"content-type"]

          def avertisment(text):
              print("::warning::" + text)

          destinatari = [a for _, a in getaddresses([os.environ["EMAIL_TO"]]) if a]
          msg = MIMEMultipart("alternative")
          msg["From"] = "GitHub Workflows <" + EXPEDITOR + ">"
          msg["To"] = ", ".join(destinatari)
          msg["Subject"] = os.environ["SUBIECT"]
          msg["Date"] = formatdate(localtime=True)
          msg["Message-ID"] = make_msgid(domain=DOMENIU)
          for fisier, tip in (("rezumat.txt", "plain"), ("rezumat.html", "html")):
              with open(fisier, encoding="utf-8") as f:
                  msg.attach(MIMEText(f.read(), tip, "utf-8"))
          # Exact octeții care pleacă: după semnare mesajul nu se mai atinge
          raw = msg.as_bytes(policy=msg.policy.clone(linesep="\r\n"))

          def semneaza(raw):
              cheie = os.environ.get("DKIM_KEY", "").replace("\r\n", "\n").strip().encode()
              if not cheie:
                  avertisment("Secretul DKIM_GITHUB_KEY lipsește: rezumatul pleacă nesemnat și nu trece DMARC.")
                  return raw, False
              try:
                  import dkim
              except ImportError:
                  avertisment("python3-dkim nu e instalat: rezumatul pleacă nesemnat și nu trece DMARC.")
                  return raw, False
              try:
                  semnatura = dkim.sign(raw, SELECTOR.encode(), DOMENIU.encode(), cheie + b"\n",
                                        canonicalize=(b"relaxed", b"relaxed"), include_headers=ANTETE_SEMNATE)
              except Exception as e:
                  avertisment("Semnarea DKIM a eșuat (" + str(e) + "): rezumatul pleacă nesemnat.")
                  return raw, False
              # Verificare cu cheia publicată în DNS: prinde un secret care nu mai corespunde înregistrării
              try:
                  if not dkim.verify(semnatura + raw):
                      avertisment("Semnătura nu se verifică cu " + SELECTOR + "._domainkey." + DOMENIU
                                  + ": cheia din secret nu corespunde celei din DNS.")
              except Exception as e:
                  avertisment("Nu am putut verifica semnătura cu DNS-ul (" + str(e) + ").")
              return semnatura + raw, True

          data, semnat = semneaza(raw)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=60) as smtp:
              smtp.login(os.environ["EMAIL_USER"], os.environ["EMAIL_PASS"])
              smtp.sendmail(EXPEDITOR, destinatari, data)
          print("Trimis" + (", semnat DKIM (" + SELECTOR + ")" if semnat else ", nesemnat") + ".")
          PYTHONEOF
