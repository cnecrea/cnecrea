name: "Dashboard — Statistici integrări"

on:
  schedule:
    # Rulează zilnic la 07:00 UTC (10:00 România) — o oră după colectarea individuală
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizeaza-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează dependențe
        run: pip install requests

      - name: Colectează statistici și generează dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/genereaza_dashboard.py

      - name: Commit dacă sunt modificări
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "📈 Actualizare dashboard statistici"
          git push
